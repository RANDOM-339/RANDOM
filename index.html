<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RANDOM Portal</title>
    <script src="https://tailwindcss.com"></script>
    <style>
        @import url('https://googleapis.com');
        
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: #0a0a0c;
            overflow: hidden;
        }

        /* Animated Background Gradients */
        .bg-glow {
            position: absolute;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(99, 102, 241, 0.15) 0%, rgba(0,0,0,0) 70%);
            top: -10%;
            left: -10%;
            animation: drift 20s infinite alternate ease-in-out;
            pointer-events: none;
        }

        .bg-glow-2 {
            position: absolute;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(236, 72, 153, 0.12) 0%, rgba(0,0,0,0) 70%);
            bottom: -10%;
            right: -10%;
            animation: drift 25s infinite alternate-reverse ease-in-out;
            pointer-events: none;
        }

        @keyframes drift {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(100px, 50px) scale(1.2); }
        }

        /* Watermark Logo styling */
        .watermark-logo {
            font-size: 14vw;
            font-weight: 800;
            letter-spacing: -0.05em;
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.03) 0%, rgba(255, 255, 255, 0) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            user-select: none;
            pointer-events: none;
            white-space: nowrap;
        }

        /* Interactive 3D Perspective Card Setup */
        .portal-container {
            perspective: 1000px;
        }

        .interactive-card {
            transition: transform 0.1s ease, box-shadow 0.3s ease;
            transform-style: preserve-3d;
        }

        .card-content {
            transform: translateZ(30px);
        }
    </style>
</head>
<body class="h-screen w-screen flex flex-col items-center justify-center relative text-white antialiased">

    <!-- Ambient Background FX -->
    <div class="bg-glow"></div>
    <div class="bg-glow-2"></div>

    <!-- Massive Cool Watermark Logo -->
    <div class="absolute inset-0 flex items-center justify-center z-0 overflow-hidden">
        <div class="watermark-logo transform -rotate-12 scale-110 tracking-widest uppercase select-none animate-pulse duration-[8s]">
            RANDOM
        </div>
    </div>

    <!-- Content Header -->
    <header class="z-10 text-center mb-12 animate-fade-in">
        <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full border border-zinc-800 bg-zinc-900/50 backdrop-blur-md mb-4 text-xs font-semibold tracking-wider text-indigo-400 uppercase">
            <span class="w-2 h-2 rounded-full bg-indigo-500 animate-ping"></span>
            Gateway Active
        </div>
        <h1 class="text-4xl font-extrabold tracking-tight bg-gradient-to-r from-white via-zinc-200 to-zinc-500 bg-clip-text text-transparent">
            Welcome to RANDOM
        </h1>
        <p class="text-zinc-500 mt-2 text-sm max-w-sm mx-auto">
            Choose an interface mode below to shape your session sandbox.
        </p>
    </header>

    <!-- Main Dynamic Portal Controls -->
    <main class="portal-container z-10 flex flex-col sm:flex-row gap-6 max-w-4xl w-full px-6 justify-center items-center">
        
        <!-- VISITOR MODE CARD -->
        <div class="interactive-card w-full sm:w-80 h-48 rounded-2xl border border-zinc-800/80 bg-zinc-900/40 backdrop-blur-xl p-6 cursor-pointer flex flex-col justify-between shadow-2xl hover:border-zinc-700/80 group" onclick="navigate('visitors')">
            <div class="card-content flex flex-col justify-between h-full">
                <div class="flex justify-between items-start">
                    <div class="p-3 bg-zinc-800/50 rounded-xl border border-zinc-700/50 group-hover:bg-zinc-800 group-hover:text-indigo-400 transition-colors">
                        <svg xmlns="http://w3.org" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" /></svg>
                    </div>
                    <span class="text-xs font-mono text-zinc-600 group-hover:text-zinc-400 transition-colors">MODE // 01</span>
                </div>
                <div>
                    <h2 class="text-xl font-bold text-zinc-200 group-hover:text-white transition-colors">VISITORS</h2>
                    <p class="text-xs text-zinc-500 mt-1">Explore, read public streams, and interact casually.</p>
                </div>
            </div>
        </div>

        <!-- CREATE READ MODE CARD -->
        <div class="interactive-card w-full sm:w-80 h-48 rounded-2xl border border-zinc-800/80 bg-zinc-900/40 backdrop-blur-xl p-6 cursor-pointer flex flex-col justify-between shadow-2xl hover:border-zinc-700/80 group" onclick="navigate('create-read')">
            <div class="card-content flex flex-col justify-between h-full">
                <div class="flex justify-between items-start">
                    <div class="p-3 bg-zinc-800/50 rounded-xl border border-zinc-700/50 group-hover:bg-zinc-800 group-hover:text-pink-400 transition-colors">
                        <svg xmlns="http://w3.org" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" /></svg>
                    </div>
                    <span class="text-xs font-mono text-zinc-600 group-hover:text-zinc-400 transition-colors">MODE // 02</span>
                </div>
                <div>
                    <h2 class="text-xl font-bold text-zinc-200 group-hover:text-white transition-colors">CREATE READ</h2>
                    <p class="text-xs text-zinc-500 mt-1">Author new entries, sync content, and structure data blocks.</p>
                </div>
            </div>
        </div>

    </main>

    
    <footer class="absolute bottom-6 z-10 text-xs text-zinc-600 tracking-widest font-mono">
        RANDOM APPARATUS &copy; 2026
    </footer>

    <!-- Script to calculate mouse tracking and 3D tilts -->
    <script>
        const cards = document.querySelectorAll('.interactive-card');
        
        cards.forEach(card => {
            document.addEventListener('mousemove', (e) => {
                const rect = card.getBoundingClientRect();
                const cardX = rect.left + rect.width / 2;
                const cardY = rect.top + rect.height / 2;
                
                // Calculate absolute distance vectorized from cursor to card center
                const angleX = (cardY - e.clientY) / 25; 
                const angleY = (e.clientX - cardX) / 25;
                
                // Limit maximum rotational shift angle
                const maxTilt = 15;
                const tiltX = Math.max(-maxTilt, Math.min(maxTilt, angleX));
                const tiltY = Math.max(-maxTilt, Math.min(maxTilt, angleY));

                card.style.transform = `rotateX(${tiltX}deg) rotateY(${tiltY}deg)`;
            });

            // Smoothly reset position when cursor leaves active viewport elements
            document.addEventListener('mouseleave', () => {
                card.style.transform = `rotateX(0deg) rotateY(0deg)`;
            });
        });

        // Click Handler Action simulation
        function navigate(destination) {
            // Flash effect for the unexpected feel
            document.body.style.background = '#ffffff';
            setTimeout(() => {
                document.body.style.transition = 'background 0.5s ease';
                document.body.style.background = '#0a0a0c';
                alert(`Navigating to the [${destination.toUpperCase()}] segment of RANDOM.`);
            }, 60);
        }
    </script>
</body>
</html>
