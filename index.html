<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neon Energy Logo</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #080823;
}

svg {
    display: block;
    width: 100%;
    height: 100%;
}

/* =========================================
   BLACK HOLE - VERY SLOW BREATHING
========================================= */

.black-hole {
    transform-box: fill-box;
    transform-origin: center;
    animation: blackHoleBreath 40s ease-in-out infinite;
}

@keyframes blackHoleBreath {
    0%, 100% {
        transform: scale(1);
    }

    50% {
        transform: scale(1.012);
    }
}

/* =========================================
   THREE SMALL ROTATING BROKEN ARCS
========================================= */

.hole-arcs {
    pointer-events: none;
}

.hole-arc {
    fill: none;
    stroke-linecap: round;
    stroke-linejoin: round;
}

/* =========================================
   FIRE - ONE SMOOTH MOVEMENT ANIMATION
========================================= */

.fire-shape {
    transform-box: fill-box;
    transform-origin: center;
    animation: fireMotion 28s ease-in-out infinite;
}

@keyframes fireMotion {
    0%, 100% {
        transform: translate(0, 0) scale(1);
    }

    25% {
        transform: translate(-1px, -1.5px) scale(1.002);
    }

    50% {
        transform: translate(1.5px, -3px) scale(1.004);
    }

    75% {
        transform: translate(-0.5px, -1px) scale(1.001);
    }
}

/* =========================================
   FIRE GLOW - SOFT BREATHING
========================================= */

.fire-glow {
    transform-box: fill-box;
    transform-origin: center;
    animation: fireGlowBreath 32s ease-in-out infinite;
}

@keyframes fireGlowBreath {
    0%, 100% {
        opacity: 0.08;
        transform: scale(1);
    }

    50% {
        opacity: 0.12;
        transform: scale(1.025);
    }
}

/* =========================================
   REDUCED MOTION
========================================= */

@media (prefers-reduced-motion: reduce) {
    .black-hole,
    .fire-shape,
    .fire-glow {
        animation: none;
    }
}
</style>
</head>

<defs>

    <!-- Background glow -->

    <radialGradient id="bgGlow">
        <stop offset="0%" stop-color="#06334b"/>
        <stop offset="45%" stop-color="#10113d"/>
        <stop offset="100%" stop-color="#080823"/>
    </radialGradient>

    <!-- Blue lightning gradient -->

    <linearGradient id="blue"
        x1="0" y1="1" x2="1" y2="0">
        <stop offset="0%" stop-color="#00bfff"/>
        <stop offset="100%" stop-color="#00dfff"/>
    </linearGradient>

    <!-- Green lightning gradient -->

    <linearGradient id="green"
        x1="0" y1="1" x2="1" y2="0">
        <stop offset="0%" stop-color="#7cff00"/>
        <stop offset="100%" stop-color="#a5ff00"/>
    </linearGradient>

    <!-- Green glow -->

    <filter id="greenGlow"
        x="-100%" y="-100%"
        width="300%" height="300%">
        <feGaussianBlur stdDeviation="28"/>
    </filter>

    <!-- Blue glow -->

    <filter id="blueGlow"
        x="-100%" y="-100%"
        width="300%" height="300%">
        <feGaussianBlur stdDeviation="35"/>
    </filter>

    <!-- =====================================
         FIRE TURBULENCE
    ====================================== -->

    <filter id="fireFlow"
        x="-5%" y="-5%"
        width="110%" height="110%"
        color-interpolation-filters="sRGB">

        <feTurbulence
            type="fractalNoise"
            baseFrequency="0.006 0.012"
            numOctaves="2"
            seed="8"
            result="turbulence">

            <animate
                attributeName="baseFrequency"
                dur="36s"
                values="
                    0.006 0.012;
                    0.009 0.016;
                    0.005 0.010;
                    0.008 0.014;
                    0.006 0.012
                "
                keyTimes="0;0.25;0.5;0.75;1"
                calcMode="spline"
                keySplines="
                    0.42 0 0.58 1;
                    0.42 0 0.58 1;
                    0.42 0 0.58 1;
                    0.42 0 0.58 1
                "
                repeatCount="indefinite"/>
        </feTurbulence>

        <feDisplacementMap
            in="SourceGraphic"
            in2="turbulence"
            scale="4"
            xChannelSelector="R"
            yChannelSelector="G">

            <animate
                attributeName="scale"
                dur="34s"
                values="2.5;5.5;3;5;2.5"
                keyTimes="0;0.25;0.5;0.75;1"
                calcMode="spline"
                keySplines="
                    0.42 0 0.58 1;
                    0.42 0 0.58 1;
                    0.42 0 0.58 1;
                    0.42 0 0.58 1
                "
                repeatCount="indefinite"/>
        </feDisplacementMap>

    </filter>

</defs>
