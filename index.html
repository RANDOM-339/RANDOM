<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RANDOM — Enter the Unknown</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

:root {
    --red: #ff294d;
    --blue: #3478ff;
    --white: #f5f7ff;
    --muted: #9ba4bd;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: Arial, Helvetica, sans-serif;
    background: #03050c;
    color: var(--white);
}

body {
    position: relative;
}

/* =========================
   COSMIC BACKGROUND
========================= */

.space {
    position: fixed;
    inset: 0;
    overflow: hidden;
    background:
        radial-gradient(circle at 15% 45%,
            rgba(255, 20, 65, .22),
            transparent 32%),
        radial-gradient(circle at 85% 50%,
            rgba(40, 100, 255, .22),
            transparent 32%),
        radial-gradient(circle at 50% 50%,
            rgba(110, 70, 255, .06),
            transparent 42%),
        #03050c;
}

.space::before {
    content: "";
    position: absolute;
    width: 75vw;
    height: 75vw;
    max-width: 850px;
    max-height: 850px;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    background:
        conic-gradient(
            from 0deg,
            rgba(255, 30, 65, .13),
            transparent 18%,
            rgba(40, 100, 255, .12),
            transparent 40%,
            rgba(255, 30, 65, .08),
            transparent 65%,
            rgba(40, 100, 255, .12),
            transparent 82%
        );
    filter: blur(35px);
    animation: cosmicRotate 30s linear infinite;
}

@keyframes cosmicRotate {
    from {
        transform: translate(-50%, -50%) rotate(0deg);
    }
    to {
        transform: translate(-50%, -50%) rotate(360deg);
    }
}

/* =========================
   PARTICLES
========================= */

.stars {
    position: absolute;
    inset: 0;
}

.star {
    position: absolute;
    width: 2px;
    height: 2px;
    border-radius: 50%;
    background: white;
    opacity: .35;
    animation: floatStar linear infinite;
}

.star:nth-child(1) { left: 8%; top: 20%; animation-duration: 9s; }
.star:nth-child(2) { left: 18%; top: 70%; animation-duration: 12s; }
.star:nth-child(3) { left: 27%; top: 32%; animation-duration: 8s; }
.star:nth-child(4) { left: 37%; top: 82%; animation-duration: 11s; }
.star:nth-child(5) { left: 48%; top: 17%; animation-duration: 13s; }
.star:nth-child(6) { left: 59%; top: 73%; animation-duration: 10s; }
.star:nth-child(7) { left: 68%; top: 28%; animation-duration: 14s; }
.star:nth-child(8) { left: 78%; top: 61%; animation-duration: 9s; }
.star:nth-child(9) { left: 88%; top: 18%; animation-duration: 12s; }
.star:nth-child(10) { left: 94%; top: 80%; animation-duration: 15s; }
.star:nth-child(11) { left: 12%; top: 48%; animation-duration: 16s; }
.star:nth-child(12) { left: 72%; top: 88%; animation-duration: 11s; }

@keyframes floatStar {
    0%,100% {
        transform: translateY(0) scale(1);
        opacity: .25;
    }
    50% {
        transform: translateY(-18px) scale(1.5);
        opacity: .75;
    }
}

/* =========================
   MAIN
========================= */

.portal {
    position: relative;
    z-index: 5;
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
}

/* =========================
   MAIN PANEL
========================= */

.panel {
    width: min(920px, 100%);
    padding: 42px 30px 34px;
    text-align: center;

    background: rgba(7, 10, 20, .52);
    border: 1px solid rgba(255,255,255,.09);
    border-radius: 34px;

    backdrop-filter: blur(22px);
    -webkit-backdrop-filter: blur(22px);

    box-shadow:
        0 30px 100px rgba(0,0,0,.55),
        inset 0 1px 0 rgba(255,255,255,.05);
}

/* =========================
   LOGO
========================= */

.logo-wrap {
    width: 112px;
    height: 112px;
    margin: 0 auto 20px;
    position: relative;
}

.logo-ring {
    position: absolute;
    inset: 0;
    border-radius: 50%;

    background:
        conic-gradient(
            from 20deg,
            var(--red),
            #ff6b81,
            #693cff,
            var(--blue),
            #49a4ff,
            var(--red)
        );

    animation: logoSpin 14s linear infinite;

    box-shadow:
        0 0 30px rgba(255, 35, 75, .22),
        0 0 55px rgba(45, 110, 255, .18);
}

.logo-ring::after {
    content: "";
    position: absolute;
    inset: 7px;
    border-radius: 50%;
    background: #060914;
}

@keyframes logoSpin {
    to {
        transform: rotate(360deg);
    }
}

.logo-core {
    position: absolute;
    inset: 18px;
    border-radius: 50%;
    z-index: 2;

    display: flex;
    align-items: center;
    justify-content: center;

    background:
        radial-gradient(circle at 35% 30%,
            #303b69,
            #090c19 58%);

    border: 1px solid rgba(255,255,255,.15);

    box-shadow:
        inset 0 0 22px rgba(70,90,255,.25);
}

/* RANDOM universe symbol */
.universe-symbol {
    width: 43px;
    height: 43px;
    position: relative;
}

.universe-symbol::before,
.universe-symbol::after {
    content: "";
    position: absolute;
    left: 50%;
    top: 50%;
    border-radius: 50%;
    transform: translate(-50%, -50%);
}

.universe-symbol::before {
    width: 38px;
    height: 15px;
    border: 2px solid rgba(255,255,255,.9);
    transform: translate(-50%, -50%) rotate(28deg);
}

.universe-symbol::after {
    width: 15px;
    height: 38px;
    border: 2px solid rgba(255,255,255,.7);
    transform: translate(-50%, -50%) rotate(-28deg);
}

.universe-symbol {
    border-radius: 50%;
    border: 4px solid #fff;
    box-shadow:
        0 0 15px rgba(255,255,255,.5),
        0 0 25px rgba(85,90,255,.35);
}

/* =========================
   BRAND
========================= */

.brand {
    font-size: clamp(42px, 9vw, 78px);
    font-weight: 900;
    letter-spacing: .16em;
    margin-left: .16em;

    background: linear-gradient(
        100deg,
        #fff,
        #dce4ff 35%,
        #ffffff 50%,
        #9fb7ff
    );

    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
}

.tagline {
    margin-top: 8px;
    color: var(--muted);
    font-size: 14px;
    letter-spacing: .22em;
    text-transform: uppercase;
}

/* =========================
   DIVIDER
========================= */

.divider {
    width: 130px;
    height: 1px;
    margin: 28px auto;

    background: linear-gradient(
        90deg,
        transparent,
        rgba(255,255,255,.55),
        transparent
    );
}

/* =========================
   CHOICES
========================= */

.choice-title {
    font-size: 13px;
    color: #79839e;
    letter-spacing: .18em;
    text-transform: uppercase;
    margin-bottom: 18px;
}

.choices {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 16px;
    max-width: 650px;
    margin: auto;
}

.choice {
    position: relative;
    min-height: 145px;
    padding: 25px 20px;

    border-radius: 22px;
    border: 1px solid rgba(255,255,255,.10);

    background: rgba(255,255,255,.035);

    overflow: hidden;
    cursor: pointer;

    transition:
        transform .3s ease,
        border-color .3s ease,
        background .3s ease,
        box-shadow .3s ease;
}

.choice::before {
    content: "";
    position: absolute;
    width: 180px;
    height: 180px;
    border-radius: 50%;
    filter: blur(35px);
    opacity: 0;
    transition: opacity .35s ease;
}

.choice.visitor::before {
    background: rgba(45,105,255,.35);
    right: -80px;
    bottom: -100px;
}

.choice.rid::before {
    background: rgba(255,35,70,.35);
    left: -80px;
    bottom: -100px;
}

.choice:hover {
    transform: translateY(-5px);
    background: rgba(255,255,255,.065);
}

.choice:hover::before {
    opacity: 1;
}

.choice.visitor:hover {
    border-color: rgba(65,125,255,.45);
    box-shadow: 0 15px 45px rgba(30,90,255,.13);
}

.choice.rid:hover {
    border-color: rgba(255,45,80,.45);
    box-shadow: 0 15px 45px rgba(255,25,60,.13);
}

.choice-icon {
    font-size: 27px;
    margin-bottom: 13px;
}

.choice-name {
    position: relative;
    z-index: 2;
    font-size: 19px;
    font-weight: 800;
    letter-spacing: .08em;
}

.choice-description {
    position: relative;
    z-index: 2;
    margin-top: 7px;
    font-size: 12px;
    line-height: 1.5;
    color: #8791aa;
}

/* =========================
   FOOTER
========================= */

.footer {
    margin-top: 25px;
    font-size: 10px;
    color: #596177;
    letter-spacing: .12em;
    text-transform: uppercase;
}

/* =========================
   MOBILE
========================= */

@media (max-width: 620px) {

    .portal {
        padding: 14px;
    }

    .panel {
        padding: 32px 17px 25px;
        border-radius: 28px;
    }

    .logo-wrap {
        width: 88px;
        height: 88px;
    }

    .logo-core {
        inset: 15px;
    }

    .universe-symbol {
        transform: scale(.78);
    }

    .brand {
        font-size: 40px;
        letter-spacing: .12em;
        margin-left: .12em;
    }

    .tagline {
        font-size: 10px;
        letter-spacing: .16em;
    }

    .divider {
        margin: 22px auto;
    }

    .choices {
        grid-template-columns: 1fr;
        gap: 11px;
    }

    .choice {
        min-height: 112px;
        padding: 19px;
        text-align: left;
    }

    .choice-icon {
        display: inline-block;
        margin-right: 8px;
        margin-bottom: 0;
    }

    .choice-name {
        display: inline-block;
        font-size: 16px;
    }

    .choice-description {
        margin-top: 7px;
        padding-left: 38px;
    }

    .footer {
        margin-top: 17px;
    }
}
</style>
</head>

<body>

<div class="space">
    <div class="stars">
        <span class="star"></span>
        <span class="star"></span>
        <span class="star"></span>
        <span class="star"></span>
        <span class="star"></span>
        <span class="star"></span>
        <span class="star"></span>
        <span class="star"></span>
        <span class="star"></span>
        <span class="star"></span>
        <span class="star"></span>
        <span class="star"></span>
    </div>
</div>

<main class="portal">

    <section class="panel">

        <div class="logo-wrap">
            <div class="logo-ring"></div>

            <div class="logo-core">
                <div class="universe-symbol"></div>
            </div>
        </div>

        <div class="brand">RANDOM</div>

        <div class="tagline">
            One universe · infinite possibilities
        </div>

        <div class="divider"></div>

        <div class="choice-title">
            Choose your way in
        </div>

        <div class="choices">

            <div class="choice visitor" onclick="visitorAction()">
                <div class="choice-icon">◉</div>

                <div class="choice-name">
                    VISITOR
                </div>

                <div class="choice-description">
                    Explore RANDOM without creating an identity.
                </div>
            </div>

            <div class="choice rid" onclick="ridAction()">
                <div class="choice-icon">✦</div>

                <div class="choice-name">
                    CREATE RID
                </div>

                <div class="choice-description">
                    Create your RANDOM identity and unlock more.
                </div>
            </div>

        </div>

        <div class="footer">
            RANDOM // Enter the unknown
        </div>

    </section>

</main>

<script>

function visitorAction() {
    alert("VISITOR mode selected — exploration system coming next.");
}

function ridAction() {
    alert("RID creation selected — identity system coming next.");
}

</script>

</body>
</html>
