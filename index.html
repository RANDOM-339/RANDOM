<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RANDOM</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
}

body{
    background:#020205;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
}


/* =====================================================
   ENVIRONMENT
===================================================== */

.scene{
    position:fixed;
    inset:0;
    overflow:hidden;
    background:#020205;
}


/* red atmosphere */

.red-glow{
    position:absolute;

    width:70vw;
    height:70vw;

    left:-35vw;
    top:50%;

    transform:translateY(-50%);

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            rgba(255,20,55,.34),
            rgba(150,5,35,.13) 38%,
            transparent 70%
        );

    filter:blur(45px);

    animation:redMove 16s ease-in-out infinite alternate;
}


/* blue atmosphere */

.blue-glow{
    position:absolute;

    width:70vw;
    height:70vw;

    right:-35vw;
    top:50%;

    transform:translateY(-50%);

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            rgba(35,105,255,.34),
            rgba(10,55,170,.13) 38%,
            transparent 70%
        );

    filter:blur(45px);

    animation:blueMove 18s ease-in-out infinite alternate;
}


@keyframes redMove{
    0%{
        transform:translateY(-50%) scale(.92);
    }

    100%{
        transform:translateY(-48%) scale(1.08);
    }
}


@keyframes blueMove{
    0%{
        transform:translateY(-50%) scale(1);
    }

    100%{
        transform:translateY(-53%) scale(.94);
    }
}


/* =====================================================
   RANDOM ATMOSPHERIC NOISE
===================================================== */

.noise{
    position:absolute;
    inset:-50%;

    opacity:.035;

    background-image:
        radial-gradient(
            circle,
            white 1px,
            transparent 1px
        );

    background-size:4px 4px;

    animation:noiseMove .8s steps(2) infinite;
}

@keyframes noiseMove{
    0%{
        transform:translate(0,0);
    }

    25%{
        transform:translate(2%,1%);
    }

    50%{
        transform:translate(-1%,2%);
    }

    75%{
        transform:translate(1%,-1%);
    }

    100%{
        transform:translate(0,0);
    }
}


/* =====================================================
   EDGE LINES
===================================================== */

.edge{
    position:absolute;
    pointer-events:none;
    opacity:.16;
}

.edge.left{
    left:0;
    top:0;
    bottom:0;
    width:1px;

    background:
        linear-gradient(
            transparent,
            rgba(255,30,60,.7),
            transparent
        );
}

.edge.right{
    right:0;
    top:0;
    bottom:0;
    width:1px;

    background:
        linear-gradient(
            transparent,
            rgba(40,110,255,.7),
            transparent
        );
}


/* =====================================================
   TOP BRAND
===================================================== */

.topbar{
    position:absolute;

    top:28px;
    left:34px;
    right:34px;

    display:flex;
    justify-content:space-between;
    align-items:center;

    z-index:10;
}

.small-brand{
    display:flex;
    align-items:center;
    gap:9px;

    font-size:10px;
    font-weight:700;

    letter-spacing:.34em;

    color:rgba(255,255,255,.62);
}

.small-mark{
    width:7px;
    height:7px;

    border-radius:50%;

    background:#fff;

    box-shadow:
        0 0 12px #fff;
}

.version{
    font-size:8px;
    letter-spacing:.20em;
    color:rgba(255,255,255,.22);
}


/* =====================================================
   MAIN PORTAL
===================================================== */

.portal{
    position:absolute;

    left:50%;
    top:50%;

    transform:translate(-50%,-50%);

    width:min(700px,92vw);

    text-align:center;

    z-index:5;
}


/* =====================================================
   LOGO SYSTEM
===================================================== */

.logo{
    position:relative;

    width:180px;
    height:180px;

    margin:0 auto 30px;

    display:flex;
    justify-content:center;
    align-items:center;

    transition:transform .25s ease;
}


/* outer orbit */

.logo-orbit{
    position:absolute;

    inset:4px;

    border-radius:50%;

    border:1px solid rgba(255,255,255,.22);

    transform:rotate(18deg) scaleX(1.18);

    animation:orbitOne 18s linear infinite;
}


/* second orbit */

.logo-orbit.two{
    inset:15px;

    transform:rotate(-42deg) scaleX(1.42);

    border-color:rgba(255,255,255,.14);

    animation:orbitTwo 23s linear infinite;
}


/* third orbit */

.logo-orbit.three{
    inset:29px;

    transform:rotate(73deg) scaleX(1.1);

    border-color:rgba(255,255,255,.10);

    animation:orbitThree 29s linear infinite;
}


@keyframes orbitOne{
    to{
        rotate:360deg;
    }
}

@keyframes orbitTwo{
    to{
        rotate:-360deg;
    }
}

@keyframes orbitThree{
    to{
        rotate:360deg;
    }
}


/* orbit particles */

.logo-orbit::before,
.logo-orbit::after{
    content:"";

    position:absolute;

    width:5px;
    height:5px;

    border-radius:50%;

    background:#fff;

    box-shadow:
        0 0 12px #fff;
}

.logo-orbit::before{
    left:13%;
    top:4%;
}

.logo-orbit::after{
    right:14%;
    bottom:3%;
}


/* =====================================================
   LOGO CORE
===================================================== */

.logo-core{
    position:relative;

    width:92px;
    height:92px;

    border-radius:50%;

    display:flex;
    align-items:center;
    justify-content:center;

    background:
        radial-gradient(
            circle at 35% 28%,
            rgba(255,255,255,.18),
            rgba(8,9,16,.96) 57%,
            #010106
        );

    border:1px solid rgba(255,255,255,.28);

    box-shadow:
        0 0 30px rgba(255,255,255,.08),
        inset 0 0 30px rgba(255,255,255,.05);
}


/* universe symbol */

.symbol{
    position:relative;

    width:48px;
    height:48px;

    border:3px solid white;

    border-radius:50%;

    box-shadow:
        0 0 16px rgba(255,255,255,.45);
}


.symbol::before,
.symbol::after{
    content:"";

    position:absolute;

    left:50%;
    top:50%;

    width:58px;
    height:18px;

    border:2px solid rgba(255,255,255,.9);

    border-radius:50%;

    transform:translate(-50%,-50%);
}


.symbol::before{
    rotate:32deg;
}

.symbol::after{
    rotate:-32deg;
}


.symbol-dot{
    position:absolute;

    width:8px;
    height:8px;

    left:50%;
    top:50%;

    transform:translate(-50%,-50%);

    background:white;

    border-radius:50%;

    box-shadow:
        0 0 15px white,
        0 0 25px rgba(90,120,255,.7);
}


/* =====================================================
   BRAND
===================================================== */

.title{
    font-size:clamp(50px,10vw,86px);

    font-weight:900;

    letter-spacing:.25em;

    margin-left:.25em;

    line-height:1;

    color:#fff;

    text-shadow:
        0 0 35px rgba(255,255,255,.08);
}


.tagline{
    margin-top:16px;

    color:rgba(255,255,255,.40);

    font-size:10px;

    letter-spacing:.34em;

    text-transform:uppercase;
}


/* =====================================================
   DIVIDER
===================================================== */

.divider{
    width:min(410px,75vw);

    height:1px;

    margin:38px auto 27px;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(255,255,255,.28),
            transparent
        );
}


/* =====================================================
   ENTRY
===================================================== */

.entry-label{
    font-size:8px;

    letter-spacing:.28em;

    color:rgba(255,255,255,.28);

    text-transform:uppercase;

    margin-bottom:16px;
}


.entries{
    display:flex;

    justify-content:center;

    gap:12px;
}


.entry{
    position:relative;

    width:220px;
    height:65px;

    border:1px solid rgba(255,255,255,.14);

    border-radius:14px;

    background:rgba(2,3,8,.45);

    color:white;

    cursor:pointer;

    overflow:hidden;

    backdrop-filter:blur(10px);

    transition:
        transform .3s ease,
        border-color .3s ease,
        background .3s ease;
}


.entry::before{
    content:"";

    position:absolute;

    width:170px;
    height:170px;

    border-radius:50%;

    filter:blur(35px);

    opacity:0;

    transition:.4s ease;
}


.entry.red::before{
    background:rgba(255,30,65,.32);

    left:-80px;
    top:-80px;
}


.entry.blue::before{
    background:rgba(35,110,255,.32);

    right:-80px;
    top:-80px;
}


.entry:hover{
    transform:translateY(-5px);

    background:rgba(255,255,255,.055);

    border-color:rgba(255,255,255,.32);
}


.entry:hover::before{
    opacity:1;
}


.entry-inner{
    position:relative;

    z-index:2;

    height:100%;

    display:flex;

    align-items:center;

    justify-content:center;

    gap:12px;
}


.entry-icon{
    font-size:17px;

    opacity:.8;
}


.entry-name{
    display:block;

    font-size:11px;

    font-weight:800;

    letter-spacing:.20em;
}


.entry-description{
    display:block;

    margin-top:4px;

    font-size:8px;

    color:rgba(255,255,255,.35);

    letter-spacing:.04em;
}


/* =====================================================
   BOTTOM MESSAGE
===================================================== */

.bottom{
    margin-top:26px;

    color:rgba(255,255,255,.20);

    font-size:8px;

    letter-spacing:.24em;

    text-transform:uppercase;
}


/* =====================================================
   RANDOMNESS
===================================================== */

.random-state{
    position:absolute;

    bottom:25px;
    left:50%;

    transform:translateX(-50%);

    z-index:10;

    color:rgba(255,255,255,.17);

    font-size:7px;

    letter-spacing:.18em;

    text-transform:uppercase;

    white-space:nowrap;
}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:600px){

    .topbar{
        top:19px;
        left:18px;
        right:18px;
    }

    .version{
        display:none;
    }

    .portal{
        width:92vw;
    }

    .logo{
        width:145px;
        height:145px;

        margin-bottom:22px;
    }

    .logo-core{
        width:76px;
        height:76px;
    }

    .symbol{
        transform:scale(.78);
    }

    .title{
        font-size:45px;

        letter-spacing:.17em;

        margin-left:.17em;
    }

    .tagline{
        font-size:8px;

        letter-spacing:.23em;

        margin-top:13px;
    }

    .divider{
        margin-top:29px;
        margin-bottom:21px;
    }

    .entries{
        flex-direction:column;

        gap:9px;

        width:100%;
    }

    .entry{
        width:100%;
        height:58px;
    }

    .bottom{
        margin-top:18px;
    }

    .random-state{
        bottom:15px;
    }
}


@media(max-height:700px){

    .logo{
        transform:scale(.78);

        margin-bottom:-3px;
    }

    .divider{
        margin-top:22px;
        margin-bottom:18px;
    }
}

</style>
</head>


<body>


<div class="scene">

    <div class="red-glow"></div>

    <div class="blue-glow"></div>

    <div class="noise"></div>

    <div class="edge left"></div>
    <div class="edge right"></div>

</div>


<header class="topbar">

    <div class="small-brand">

        <span class="small-mark"></span>

        RANDOM

    </div>

    <div class="version">

        UNKNOWN / 001

    </div>

</header>


<main class="portal">


    <!-- =========================================
         LOGO
    ========================================== -->

    <div
        class="logo"
        id="logo"
    >

        <div class="logo-orbit"></div>

        <div class="logo-orbit two"></div>

        <div class="logo-orbit three"></div>


        <div class="logo-core">

            <div class="symbol">

                <span class="symbol-dot"></span>

            </div>

        </div>

    </div>


    <!-- =========================================
         BRAND
    ========================================== -->

    <h1 class="title">

        RANDOM

    </h1>


    <p class="tagline">

        Nothing here is predetermined.

    </p>


    <div class="divider"></div>


    <!-- =========================================
         ENTRY
    ========================================== -->

    <div class="entry-label">

        Choose your beginning

    </div>


    <div class="entries">


        <button
            class="entry blue"
            onclick="visitor()"
        >

            <div class="entry-inner">

                <span class="entry-icon">
                    ◉
                </span>

                <span>

                    <span class="entry-name">
                        VISITOR
                    </span>

                    <span class="entry-description">
                        Explore without an identity
                    </span>

                </span>

            </div>

        </button>


        <button
            class="entry red"
            onclick="createRID()"
        >

            <div class="entry-inner">

                <span class="entry-icon">
                    ✦
                </span>

                <span>

                    <span class="entry-name">
                        CREATE RID
                    </span>

                    <span class="entry-description">
                        Begin your RANDOM identity
                    </span>

                </span>

            </div>

        </button>


    </div>


    <div class="bottom">

        RANDOM / ENTER THE UNEXPECTED

    </div>

</main>


<div class="random-state" id="state">

    RANDOM STATE // CALCULATING

</div>


<script>

/* =====================================================
   RANDOM ATMOSPHERE

   Every refresh creates a slightly different
   visual atmosphere.
===================================================== */

const redGlow =
    document.querySelector(".red-glow");

const blueGlow =
    document.querySelector(".blue-glow");

const logo =
    document.getElementById("logo");

const state =
    document.getElementById("state");


const randomNumber =
    Math.random();


/*
Different refresh = slightly different
scale/intensity/position.
*/

const redScale =
    .92 + Math.random() * .18;

const blueScale =
    .92 + Math.random() * .18;


redGlow.style.opacity =
    (.75 + Math.random() * .25).toFixed(2);

blueGlow.style.opacity =
    (.75 + Math.random() * .25).toFixed(2);

redGlow.style.transform =
    `translateY(-50%) scale(${redScale})`;

blueGlow.style.transform =
    `translateY(-50%) scale(${blueScale})`;


/*
Random visual state label.
*/

const states = [
    "RANDOM STATE // UNDEFINED",
    "RANDOM STATE // UNSTABLE",
    "RANDOM STATE // UNKNOWN",
    "RANDOM STATE // OPEN",
    "RANDOM STATE // DISCOVERED"
];

state.textContent =
    states[Math.floor(Math.random() * states.length)];


/* =====================================================
   SUBTLE MOUSE MOVEMENT
===================================================== */

document.addEventListener(
    "mousemove",
    function(event){

        const x =
            (event.clientX /
            window.innerWidth - .5);

        const y =
            (event.clientY /
            window.innerHeight - .5);


        logo.style.transform =
            `
            translate(
                ${x * 7}px,
                ${y * 7}px
            )
            `;

    }
);


/* =====================================================
   TEMPORARY ACTIONS

   Real RID/login flow comes later.
===================================================== */

function visitor(){

    alert(
        "VISITOR MODE\n\n" +
        "RANDOM exploration begins here."
    );

}


function createRID(){

    alert(
        "CREATE RID\n\n" +
        "Your RANDOM identity begins here."
    );

}

</script>

</body>
    </html>
