<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RANDOM</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#050509;
    color:white;
}

/* ================================
   RANDOM WORLD
================================ */

.world{
    position:fixed;
    inset:-8%;
    overflow:hidden;
    transition:background 1.5s ease;
}

/* Red universe */
.world.red{
    background:
        radial-gradient(
            ellipse at 18% 52%,
            rgba(180,10,35,.42),
            transparent 30%
        ),
        radial-gradient(
            ellipse at 82% 35%,
            rgba(95,0,18,.42),
            transparent 35%
        ),
        radial-gradient(
            ellipse at 50% 100%,
            rgba(90,5,25,.30),
            transparent 45%
        ),
        #070407;
}

/* Blue universe */
.world.blue{
    background:
        radial-gradient(
            ellipse at 82% 52%,
            rgba(20,75,190,.42),
            transparent 30%
        ),
        radial-gradient(
            ellipse at 18% 35%,
            rgba(10,35,120,.42),
            transparent 35%
        ),
        radial-gradient(
            ellipse at 50% 100%,
            rgba(15,55,130,.30),
            transparent 45%
        ),
        #03060d;
}

/* ================================
   MOVING NEBULA
================================ */

.nebula{
    position:absolute;
    width:70vw;
    height:70vw;
    max-width:800px;
    max-height:800px;
    border-radius:50%;

    left:50%;
    top:50%;

    transform:translate(-50%,-50%);

    filter:blur(55px);
    opacity:.52;

    animation:
        nebulaMove 18s ease-in-out infinite alternate,
        nebulaRotate 45s linear infinite;
}

.red .nebula{
    background:
        conic-gradient(
            from 30deg,
            rgba(255,20,55,.55),
            transparent 25%,
            rgba(120,0,30,.40),
            transparent 52%,
            rgba(255,35,70,.35),
            transparent 78%
        );
}

.blue .nebula{
    background:
        conic-gradient(
            from 30deg,
            rgba(35,110,255,.55),
            transparent 25%,
            rgba(15,45,160,.40),
            transparent 52%,
            rgba(50,140,255,.35),
            transparent 78%
        );
}

@keyframes nebulaMove{
    0%{
        margin-left:-4%;
        margin-top:-2%;
        transform:translate(-50%,-50%) scale(.95);
    }

    50%{
        margin-left:4%;
        margin-top:3%;
        transform:translate(-50%,-50%) scale(1.05);
    }

    100%{
        margin-left:-2%;
        margin-top:5%;
        transform:translate(-50%,-50%) scale(.98);
    }
}

@keyframes nebulaRotate{
    to{
        rotate:360deg;
    }
}

/* ================================
   ORBIT LINES
================================ */

.orbits{
    position:absolute;
    width:min(90vw,850px);
    height:min(90vw,850px);

    left:50%;
    top:50%;

    transform:translate(-50%,-50%);
    opacity:.17;
}

.orbit{
    position:absolute;
    inset:0;
    border:1px solid rgba(255,255,255,.30);
    border-radius:50%;
}

.orbit.one{
    transform:rotate(25deg) scaleY(.27);
    animation:orbitA 22s linear infinite;
}

.orbit.two{
    transform:rotate(-35deg) scaleY(.18);
    animation:orbitB 30s linear infinite;
}

.orbit.three{
    transform:rotate(70deg) scaleY(.11);
    animation:orbitC 38s linear infinite;
}

@keyframes orbitA{
    to{rotate:360deg;}
}

@keyframes orbitB{
    to{rotate:-360deg;}
}

@keyframes orbitC{
    to{rotate:360deg;}
}

/* ================================
   STARS
================================ */

.stars{
    position:absolute;
    inset:0;
}

.star{
    position:absolute;
    width:2px;
    height:2px;
    border-radius:50%;
    background:white;
    opacity:.35;
    animation:twinkle 4s ease-in-out infinite;
}

.s1{left:9%;top:19%;animation-delay:0s}
.s2{left:17%;top:73%;animation-delay:1s}
.s3{left:27%;top:31%;animation-delay:2s}
.s4{left:39%;top:15%;animation-delay:.5s}
.s5{left:48%;top:82%;animation-delay:1.7s}
.s6{left:59%;top:24%;animation-delay:2.4s}
.s7{left:69%;top:71%;animation-delay:.8s}
.s8{left:78%;top:17%;animation-delay:1.2s}
.s9{left:88%;top:47%;animation-delay:2.7s}
.s10{left:93%;top:79%;animation-delay:1.5s}
.s11{left:31%;top:89%;animation-delay:3s}
.s12{left:73%;top:91%;animation-delay:.2s}

@keyframes twinkle{
    0%,100%{
        opacity:.18;
        transform:scale(.8);
    }

    50%{
        opacity:.75;
        transform:scale(1.7);
    }
}

/* ================================
   DARK GLASS
================================ */

.shade{
    position:absolute;
    inset:0;

    background:
        radial-gradient(
            ellipse at center,
            transparent 18%,
            rgba(0,0,0,.38) 100%
        );

    backdrop-filter:blur(1px);
}

/* ================================
   PORTAL
================================ */

.portal{
    position:relative;
    z-index:5;

    width:100%;
    height:100%;

    display:flex;
    justify-content:center;
    align-items:center;

    padding:25px;
}

.content{
    width:min(620px,100%);
    text-align:center;
}

/* ================================
   RANDOM LOGO
================================ */

.logo{
    position:relative;

    width:132px;
    height:132px;

    margin:0 auto 25px;

    display:flex;
    justify-content:center;
    align-items:center;
}

/* outer universe */
.logo::before{
    content:"";

    position:absolute;
    inset:3px;

    border-radius:50%;

    border:1px solid rgba(255,255,255,.55);

    box-shadow:
        0 0 25px rgba(255,255,255,.08),
        inset 0 0 25px rgba(255,255,255,.05);
}

/* orbit */
.logo::after{
    content:"";

    position:absolute;

    width:145px;
    height:50px;

    border-radius:50%;

    border:2px solid rgba(255,255,255,.65);

    transform:rotate(-32deg);

    box-shadow:
        0 0 15px rgba(255,255,255,.08);

    animation:logoOrbit 9s linear infinite;
}

@keyframes logoOrbit{
    to{
        transform:rotate(328deg);
    }
}

/* core */
.core{
    width:78px;
    height:78px;

    border-radius:50%;

    position:relative;

    display:flex;
    justify-content:center;
    align-items:center;

    background:
        radial-gradient(
            circle at 35% 30%,
            rgba(255,255,255,.25),
            rgba(20,20,35,.96) 55%,
            #020207
        );

    border:1px solid rgba(255,255,255,.35);

    box-shadow:
        0 0 30px rgba(255,255,255,.10),
        inset 0 0 25px rgba(255,255,255,.06);
}

/* RANDOM cosmic symbol */
.symbol{
    width:43px;
    height:43px;

    position:relative;

    border-radius:50%;

    border:3px solid white;

    box-shadow:
        0 0 12px rgba(255,255,255,.5);
}

/* crossing universe paths */
.symbol span{
    position:absolute;

    width:54px;
    height:18px;

    left:50%;
    top:50%;

    transform:translate(-50%,-50%);

    border:2px solid white;
    border-radius:50%;
}

.symbol span:nth-child(1){
    rotate:32deg;
}

.symbol span:nth-child(2){
    rotate:-32deg;
}

/* ================================
   BRAND
================================ */

.title{
    font-size:clamp(48px,12vw,82px);

    font-weight:900;

    letter-spacing:.22em;

    margin-left:.22em;

    line-height:1;

    background:
        linear-gradient(
            90deg,
            #ffffff,
            #c8cbd5,
            #ffffff
        );

    -webkit-background-clip:text;
    background-clip:text;

    color:transparent;

    text-shadow:
        0 0 30px rgba(255,255,255,.05);
}

.subtitle{
    margin-top:16px;

    color:rgba(255,255,255,.55);

    font-size:12px;

    letter-spacing:.30em;

    text-transform:uppercase;
}

/* ================================
   PORTAL LINE
================================ */

.portal-line{
    display:flex;
    align-items:center;
    gap:12px;

    width:min(420px,85%);

    margin:38px auto 26px;

    color:rgba(255,255,255,.42);

    font-size:10px;

    letter-spacing:.24em;

    text-transform:uppercase;
}

.portal-line::before,
.portal-line::after{
    content:"";
    height:1px;
    flex:1;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(255,255,255,.30)
        );
}

.portal-line::after{
    background:
        linear-gradient(
            90deg,
            rgba(255,255,255,.30),
            transparent
        );
}

/* ================================
   ENTRY BUTTONS
================================ */

.entries{
    display:grid;

    grid-template-columns:1fr 1fr;

    gap:14px;

    width:min(500px,100%);

    margin:auto;
}

.entry{
    position:relative;

    min-height:115px;

    border-radius:20px;

    border:1px solid rgba(255,255,255,.13);

    background:rgba(5,7,15,.38);

    backdrop-filter:blur(12px);

    cursor:pointer;

    overflow:hidden;

    transition:
        transform .35s ease,
        border-color .35s ease,
        background .35s ease;
}

.entry::before{
    content:"";

    position:absolute;

    width:120px;
    height:120px;

    border-radius:50%;

    filter:blur(35px);

    opacity:0;

    transition:.35s ease;
}

.entry.visitor::before{
    background:rgba(50,110,255,.35);
    right:-50px;
    bottom:-70px;
}

.entry.rid::before{
    background:rgba(255,30,60,.35);
    left:-50px;
    bottom:-70px;
}

.entry:hover{
    transform:translateY(-5px);
    background:rgba(255,255,255,.07);
}

.entry:hover::before{
    opacity:1;
}

.entry.visitor:hover{
    border-color:rgba(65,125,255,.50);
}

.entry.rid:hover{
    border-color:rgba(255,50,75,.50);
}

.entry-inner{
    position:relative;
    z-index:2;

    height:100%;

    display:flex;
    flex-direction:column;

    justify-content:center;
    align-items:center;

    padding:20px;
}

.entry-symbol{
    font-size:22px;
    margin-bottom:10px;
}

.entry-name{
    font-size:15px;

    font-weight:800;

    letter-spacing:.15em;
}

.entry-text{
    margin-top:7px;

    color:rgba(255,255,255,.42);

    font-size:10px;

    letter-spacing:.03em;
}

/* ================================
   BOTTOM
================================ */

.bottom{
    margin-top:24px;

    font-size:9px;

    color:rgba(255,255,255,.25);

    letter-spacing:.20em;

    text-transform:uppercase;
}

/* ================================
   MOBILE
================================ */

@media(max-width:600px){

    .portal{
        padding:18px;
    }

    .logo{
        width:105px;
        height:105px;
        margin-bottom:21px;
    }

    .logo::after{
        width:118px;
        height:42px;
    }

    .core{
        width:64px;
        height:64px;
    }

    .symbol{
        width:36px;
        height:36px;
    }

    .symbol span{
        width:45px;
        height:15px;
    }

    .title{
        font-size:43px;
        letter-spacing:.16em;
        margin-left:.16em;
    }

    .subtitle{
        font-size:9px;
        letter-spacing:.22em;
        margin-top:13px;
    }

    .portal-line{
        margin-top:30px;
        margin-bottom:20px;
    }

    .entries{
        grid-template-columns:1fr;
        gap:10px;
    }

    .entry{
        min-height:88px;
    }

    .entry-inner{
        flex-direction:row;
        justify-content:flex-start;
        text-align:left;
        padding:17px 20px;
    }

    .entry-symbol{
        margin:0 15px 0 0;
        font-size:20px;
    }

    .entry-name{
        font-size:14px;
    }

    .entry-text{
        margin-top:4px;
    }

    .bottom{
        margin-top:17px;
    }
}
</style>
</head>

<body>

<!-- RANDOM WILL CHOOSE ONE UNIVERSE -->
<div id="world" class="world">

    <div class="nebula"></div>

    <div class="orbits">
        <div class="orbit one"></div>
        <div class="orbit two"></div>
        <div class="orbit three"></div>
    </div>

    <div class="stars">
        <span class="star s1"></span>
        <span class="star s2"></span>
        <span class="star s3"></span>
        <span class="star s4"></span>
        <span class="star s5"></span>
        <span class="star s6"></span>
        <span class="star s7"></span>
        <span class="star s8"></span>
        <span class="star s9"></span>
        <span class="star s10"></span>
        <span class="star s11"></span>
        <span class="star s12"></span>
    </div>

    <div class="shade"></div>

</div>


<main class="portal">

    <section class="content">

        <!-- RANDOM LOGO -->
        <div class="logo">

            <div class="core">

                <div class="symbol">
                    <span></span>
                    <span></span>
                </div>

            </div>

        </div>


        <!-- BRAND -->
        <div class="title">
            RANDOM
        </div>

        <div class="subtitle">
            Enter a universe without limits
        </div>


        <!-- ENTRY -->
        <div class="portal-line">
            Choose your entry
        </div>


        <div class="entries">

            <button
                class="entry visitor"
                onclick="visitor()"
            >

                <div class="entry-inner">

                    <div class="entry-symbol">
                        ◉
                    </div>

                    <div>
                        <div class="entry-name">
                            VISITOR
                        </div>

                        <div class="entry-text">
                            Explore RANDOM
                        </div>
                    </div>

                </div>

            </button>


            <button
                class="entry rid"
                onclick="createRID()"
            >

                <div class="entry-inner">

                    <div class="entry-symbol">
                        ✦
                    </div>

                    <div>
                        <div class="entry-name">
                            CREATE RID
                        </div>

                        <div class="entry-text">
                            Create your identity
                        </div>
                    </div>

                </div>

            </button>

        </div>


        <div class="bottom">
            RANDOM // Identity • Gaming • Creation • More
        </div>

    </section>

</main>


<script>

/*
========================================
RANDOM UNIVERSE SELECTOR

Every new visit gets either:
RED UNIVERSE
or
BLUE UNIVERSE
========================================
*/

const world = document.getElementById("world");

const universe =
    Math.random() < 0.5
    ? "red"
    : "blue";

world.classList.add(universe);


/*
========================================
TEMPORARY ACTIONS

These will later connect to the
real RANDOM system.
========================================
*/

function visitor(){

    alert(
        "VISITOR selected.\n\n" +
        "RANDOM exploration will open here."
    );

}

function createRID(){

    alert(
        "CREATE RID selected.\n\n" +
        "Your RANDOM identity creation will begin here."
    );

}

</script>

</body>
                </html>
