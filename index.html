<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />

  <title>RANDOM — Everything is RANDOM.</title>
  <meta
    name="description"
    content="Everything is RANDOM. The next-generation intelligent requirement and discovery network."
  />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=JetBrains+Mono:ital,wght@0,300;0,400;0,500;0,600;1,400&display=swap"
    rel="stylesheet"
  >

  <style>
    /* ==========================================================================
       DESIGN SYSTEM
       ========================================================================== */

    :root {
      --bg-deep: #030504;
      --bg-surface: rgba(10, 15, 12, 0.55);
      --bg-elevated: rgba(14, 21, 16, 0.75);

      --border-subtle: rgba(163, 255, 18, 0.12);
      --border-glow: rgba(163, 255, 18, 0.35);
      --border-cyan: rgba(0, 240, 255, 0.25);

      --accent-lime: #a3ff12;
      --accent-lime-dim: rgba(163, 255, 18, 0.12);
      --accent-lime-glow: rgba(163, 255, 18, 0.25);

      --accent-cyan: #00f0ff;
      --accent-cyan-dim: rgba(0, 240, 255, 0.12);

      --accent-amber: #ffb703;
      --accent-red: #ff3366;
      --accent-red-dim: rgba(255, 51, 102, 0.12);

      --text-main: #f2f7f4;
      --text-muted: #7e9185;
      --text-dim: #3d4c42;

      --font-sans: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;

      --ease-expo: cubic-bezier(0.16, 1, 0.3, 1);
      --ease-bounce: cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: var(--bg-deep);
      color: var(--text-main);
      font-family: var(--font-sans);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      user-select: none;
    }

    :focus-visible {
      outline: 2px solid var(--accent-lime);
      outline-offset: 4px;
      border-radius: 4px;
    }

    button {
      font-family: inherit;
      color: inherit;
      background: none;
      border: none;
      cursor: pointer;
    }

    /* ==========================================================================
       ATMOSPHERIC CANVAS & BACKGROUND
       ========================================================================== */

    #network-canvas {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      z-index: 0;
      pointer-events: none;
    }

    .vignette-overlay {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;

      background:
        radial-gradient(
          circle at center,
          transparent 30%,
          rgba(3, 5, 4, 0.92) 90%
        );
    }

    .grid-overlay {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;

      background-image:
        linear-gradient(
          to right,
          rgba(255, 255, 255, 0.015) 1px,
          transparent 1px
        ),
        linear-gradient(
          to bottom,
          rgba(255, 255, 255, 0.015) 1px,
          transparent 1px
        );

      background-size: 90px 90px;

      mask-image:
        radial-gradient(
          circle at center,
          black 20%,
          transparent 80%
        );
    }

    /* ==========================================================================
       PRIMARY LAYOUT
       ========================================================================== */

    .app-viewport {
      position: relative;
      z-index: 2;

      width: 100vw;
      height: 100vh;

      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;

      padding:
        clamp(1.25rem, 3vh, 2.5rem)
        clamp(1.25rem, 4vw, 3.5rem);
    }

    /* ==========================================================================
       HEADER
       ========================================================================== */

    .system-header {
      width: 100%;
      max-width: 1200px;

      display: flex;
      justify-content: space-between;
      align-items: center;

      z-index: 10;
    }

    .brand-mark {
      display: inline-flex;
      align-items: center;
      justify-content: center;

      text-decoration: none;
      padding: 4px;
      border-radius: 8px;

      transition: opacity 0.3s ease;
    }

    .brand-mark:hover {
      opacity: 0.85;
    }

    /* ==========================================================================
       RANDOM LOGO
       ========================================================================== */

    .brand {
      position: absolute;

      left: 20px;
      top: 18px;

      width: 38px;
      height: 38px;

      z-index: 30;
    }

    .brand-symbol {
      position: relative;

      width: 38px;
      height: 38px;

      transform: rotate(-8deg);

      filter:
        drop-shadow(
          0 0 11px
          rgba(216, 255, 69, 0.14)
        );
    }

    .loop {
      position: absolute;

      width: 31px;
      height: 17px;

      border: 1.5px solid #d8ff45;

      border-radius: 55% 45% 55% 45%;
    }

    .loop.one {
      left: 1px;
      top: 10px;

      transform: rotate(29deg);

      border-right-color:
        rgba(216, 255, 69, 0.18);
    }

    .loop.two {
      right: 1px;
      top: 10px;

      transform: rotate(-29deg);

      border-color: #63e9dc;

      border-left-color:
        rgba(99, 233, 220, 0.18);
    }

    /* ==========================================================================
       BLACK HOLE CORE
       Very slow + subtle futuristic animation
       ========================================================================== */

    .brand-core {
      position: absolute;

      width: 6px;
      height: 6px;

      left: 16px;
      top: 15px;

      background: #000;

      border-radius: 50%;

      z-index: 5;

      box-shadow:
        0 0 4px rgba(0, 0, 0, 0.95),
        0 0 9px rgba(0, 0, 0, 0.85);

      /*
        Very slow gravitational breathing.
        9 seconds = deliberately subtle.
      */
      animation:
        blackHoleCore 9s ease-in-out infinite;
    }

    /*
      Tiny gravitational ring around the black hole.

      It doesn't create a big visible ring.
      It simply gives the core a microscopic futuristic movement.
    */
    .brand-core::before {
      content: "";

      position: absolute;

      left: 50%;
      top: 50%;

      width: 11px;
      height: 5px;

      transform:
        translate(-50%, -50%)
        rotate(-18deg);

      border-radius: 50%;

      border:
        0.7px solid
        rgba(216, 255, 69, 0.20);

      opacity: 0.35;

      filter:
        blur(0.15px)
        drop-shadow(
          0 0 3px
          rgba(216, 255, 69, 0.12)
        );

      animation:
        blackHoleRing 11s linear infinite;
    }

    /*
      Extremely small cyan secondary distortion.
      Slow enough that it feels like gravitational motion,
      not a normal UI animation.
    */
    .brand-core::after {
      content: "";

      position: absolute;

      left: 50%;
      top: 50%;

      width: 8px;
      height: 3px;

      transform:
        translate(-50%, -50%)
        rotate(62deg);

      border-radius: 50%;

      border:
        0.6px solid
        rgba(99, 233, 220, 0.16);

      opacity: 0.28;

      animation:
        blackHoleSecondaryRing 13s ease-in-out infinite;
    }

    @keyframes blackHoleCore {
      0%,
      100% {
        transform: scale(1);
        box-shadow:
          0 0 4px rgba(0, 0, 0, 0.95),
          0 0 9px rgba(0, 0, 0, 0.85);
      }

      50% {
        transform: scale(0.86);
        box-shadow:
          0 0 5px rgba(0, 0, 0, 1),
          0 0 12px rgba(0, 0, 0, 0.95);
      }
    }

    @keyframes blackHoleRing {
      0% {
        transform:
          translate(-50%, -50%)
          rotate(-18deg)
          scaleX(0.9);
        opacity: 0.20;
      }

      50% {
        transform:
          translate(-50%, -50%)
          rotate(162deg)
          scaleX(1.05);
        opacity: 0.42;
      }

      100% {
        transform:
          translate(-50%, -50%)
          rotate(342deg)
          scaleX(0.9);
        opacity: 0.20;
      }
    }

    @keyframes blackHoleSecondaryRing {
      0%,
      100% {
        transform:
          translate(-50%, -50%)
          rotate(62deg)
          scaleX(0.85);

        opacity: 0.16;
      }

      50% {
        transform:
          translate(-50%, -50%)
          rotate(242deg)
          scaleX(1.08);

        opacity: 0.34;
      }
    }

    /* ==========================================================================
       MOBILE LOGO POSITION
       ========================================================================== */

    @media (max-width: 600px) {
      .brand {
        left: 16px;
        top: 16px;
      }
    }

    /* ==========================================================================
       EARLY ACCESS BADGE
       ========================================================================== */

    .early-access-badge {
      display: flex;
      align-items: center;
      gap: 8px;

      font-family: var(--font-mono);
      font-size: 0.65rem;
      font-weight: 600;
      letter-spacing: 0.2em;

      color: var(--accent-red);
      text-transform: uppercase;

      background:
        rgba(255, 51, 102, 0.06);

      padding: 6px 14px;

      border-radius: 100px;

      border:
        1px solid
        rgba(255, 51, 102, 0.25);

      backdrop-filter: blur(8px);

      box-shadow:
        0 0 15px
        rgba(255, 51, 102, 0.08);

      transition:
        border-color 0.3s ease;
    }

    .early-access-badge:hover {
      border-color:
        rgba(255, 51, 102, 0.45);
    }

    .badge-red-dot {
      width: 6px;
      height: 6px;

      border-radius: 50%;

      background: var(--accent-red);

      box-shadow:
        0 0 8px
        var(--accent-red);

      animation:
        badgeGlow 4s ease-in-out infinite;
    }

    @keyframes badgeGlow {
      0%,
      100% {
        opacity: 1;
        transform: scale(1);
      }

      50% {
        opacity: 0.4;
        transform: scale(0.85);
      }
    }

    /* ==========================================================================
       HERO
       ========================================================================== */

    .hero-spatial {
      display: flex;
      flex-direction: column;
      align-items: center;

      text-align: center;

      max-width: 900px;

      margin: auto;

      position: relative;
    }

    .wordmark-container {
      position: relative;

      margin-bottom: 0.75rem;

      overflow: hidden;
    }

    .wordmark {
      font-size:
        clamp(3.8rem, 13vw, 9rem);

      font-weight: 700;

      letter-spacing: 0.22em;
      margin-right: -0.22em;

      text-transform: uppercase;

      background:
        linear-gradient(
          180deg,
          #ffffff 35%,
          rgba(180, 200, 190, 0.45) 100%
        );

      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;

      line-height: 0.95;

      filter:
        drop-shadow(
          0 20px 40px
          rgba(0, 0, 0, 0.9)
        );

      position: relative;
    }

    /* ==========================================================================
       WORDMARK LIGHT SWEEP
       ========================================================================== */

    .wordmark-container::after {
      content: '';

      position: absolute;

      top: -20%;
      left: -120%;

      width: 45%;
      height: 140%;

      background:
        linear-gradient(
          90deg,
          transparent 0%,
          rgba(255, 255, 255, 0.12) 50%,
          transparent 100%
        );

      transform: skewX(-20deg);

      animation:
        lightSweepSlow 14s ease-in-out infinite;

      pointer-events: none;
    }

    @keyframes lightSweepSlow {
      0%,
      65% {
        left: -120%;
      }

      100% {
        left: 220%;
      }
    }

    .philosophy-tag {
      font-family: var(--font-mono);

      font-size:
        clamp(0.85rem, 1.8vw, 1.15rem);

      font-weight: 400;

      letter-spacing: 0.35em;

      color: var(--text-muted);

      text-transform: uppercase;

      margin-bottom: 3.5rem;

      opacity: 0.85;
    }

    /* ==========================================================================
       ACTION BUTTONS
       ========================================================================== */

    .spatial-actions {
      display: flex;
      align-items: center;
      justify-content: center;

      gap: 2rem;

      width: 100%;
      max-width: 680px;

      position: relative;
    }

    .action-node {
      position: relative;

      flex: 1;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      padding: 1.6rem 1.8rem;

      background:
        rgba(10, 16, 12, 0.45);

      border:
        1px solid
        var(--border-subtle);

      border-radius: 20px;

      backdrop-filter: blur(16px);

      transition:
        all 0.4s var(--ease-expo);

      overflow: hidden;

      box-shadow:
        0 10px 30px
        rgba(0, 0, 0, 0.6);

      cursor: pointer;
    }

    .action-node::before {
      content: '';

      position: absolute;
      inset: 0;

      background:
        radial-gradient(
          circle at
          var(--mouse-x, 50%)
          var(--mouse-y, 50%),
          rgba(163, 255, 18, 0.08),
          transparent 70%
        );

      opacity: 0;

      transition:
        opacity 0.3s ease;
    }

    .action-node:hover::before {
      opacity: 1;
    }

    .action-node:hover {
      border-color:
        var(--accent-lime);

      transform:
        translateY(-4px);

      box-shadow:
        0 20px 40px rgba(0, 0, 0, 0.8),
        0 0 25px var(--accent-lime-dim);
    }

    .node-title {
      font-family: var(--font-mono);

      font-size: 1.1rem;
      font-weight: 600;

      letter-spacing: 0.22em;

      color: var(--text-main);

      text-transform: uppercase;

      margin-bottom: 0.35rem;

      display: flex;
      align-items: center;

      gap: 10px;
    }

    .node-title svg {
      width: 18px;
      height: 18px;

      stroke:
        var(--accent-lime);

      transition:
        transform 0.3s var(--ease-expo);
    }

    .action-node:hover .node-title svg {
      transform:
        translateX(4px);
    }

    .node-caption {
      font-size: 0.75rem;

      color:
        var(--text-muted);

      letter-spacing: 0.05em;
    }

    .action-node-create {
      border-color:
        rgba(0, 240, 255, 0.18);
    }

    .action-node-create:hover {
      border-color:
        var(--accent-cyan);

      box-shadow:
        0 20px 40px rgba(0, 0, 0, 0.8),
        0 0 25px var(--accent-cyan-dim);
    }

    .action-node-create .node-title svg {
      stroke:
        var(--accent-cyan);
    }

    /* ==========================================================================
       TOAST
       ========================================================================== */

    .toast-overlay {
      position: fixed;

      top: 50%;
      left: 50%;

      transform:
        translate(-50%, -50%)
        scale(0.9);

      background:
        rgba(8, 14, 10, 0.92);

      border:
        1px solid
        var(--border-glow);

      border-radius: 100px;

      padding:
        1rem 2.2rem;

      font-family: var(--font-mono);

      font-size: 0.85rem;

      letter-spacing: 0.2em;

      color:
        var(--accent-lime);

      backdrop-filter: blur(20px);

      box-shadow:
        0 20px 50px rgba(0, 0, 0, 0.9),
        0 0 30px var(--accent-lime-dim);

      opacity: 0;
      visibility: hidden;

      pointer-events: none;

      transition:
        all 0.4s var(--ease-expo);

      z-index: 1000;

      text-align: center;
    }

    .toast-overlay.cyan-theme {
      border-color:
        var(--border-cyan);

      color:
        var(--accent-cyan);

      box-shadow:
        0 20px 50px rgba(0, 0, 0, 0.9),
        0 0 30px var(--accent-cyan-dim);
    }

    .toast-overlay.active {
      opacity: 1;
      visibility: visible;

      transform:
        translate(-50%, -50%)
        scale(1);
    }

    /* ==========================================================================
       FOOTER
       ========================================================================== */

    .system-footer {
      font-family: var(--font-mono);

      font-size: 0.65rem;

      letter-spacing: 0.2em;

      color:
        var(--text-dim);

      text-transform: uppercase;

      z-index: 10;
    }

    /* ==========================================================================
       AI ROBOT
       ========================================================================== */

    .robot-anchor {
      position: fixed;

      bottom:
        clamp(1.25rem, 3vh, 2.5rem);

      right:
        clamp(1.25rem, 4vw, 3.5rem);

      z-index: 100;

      display: flex;

      flex-direction: column;

      align-items: flex-end;
    }

    .robot-entity-btn {
      position: relative;

      display: flex;
      align-items: center;

      gap: 12px;

      padding: 4px;

      border-radius: 100px;

      outline: none;

      cursor: pointer;
    }

    .robot-chassis {
      width: 52px;
      height: 52px;

      position: relative;

      display: flex;
      align-items: center;
      justify-content: center;

      background:
        rgba(8, 14, 10, 0.85);

      border:
        1px solid
        var(--border-subtle);

      border-radius: 50%;

      backdrop-filter: blur(16px);

      transition:
        all 0.4s var(--ease-expo);

      box-shadow:
        0 10px 25px
        rgba(0, 0, 0, 0.7);
    }

    .robot-entity-btn:hover .robot-chassis {
      border-color:
        var(--border-glow);

      box-shadow:
        0 0 20px
        var(--accent-lime-dim);
    }

    .robot-svg {
      width: 32px;
      height: 32px;

      overflow: visible;

      transition:
        transform 0.3s var(--ease-expo);
    }

    .robot-eye {
      transition:
        all 0.3s ease;

      transform-origin: center;
    }

    /* SLEEPING */

    .robot-entity-btn[data-state="SLEEPING"] .robot-chassis {
      border-color:
        rgba(255, 255, 255, 0.05);

      animation:
        robotBreathing 6s infinite ease-in-out;
    }

    .robot-entity-btn[data-state="SLEEPING"] .robot-eye {
      fill:
        rgba(163, 255, 18, 0.35);

      transform:
        scaleY(0.15);

      filter:
        drop-shadow(
          0 0 2px
          rgba(163, 255, 18, 0.2)
        );
    }

    @keyframes robotBreathing {
      0%,
      100% {
        transform:
          translateY(0)
          scale(1);
      }

      50% {
        transform:
          translateY(2px)
          scale(0.98);
      }
    }

    /* ACTIVE */

    .robot-entity-btn[data-state="ACTIVE"] .robot-chassis {
      border-color:
        var(--accent-lime);

      box-shadow:
        0 0 25px
        var(--accent-lime-dim);

      animation:
        robotActivePulse 3.5s infinite ease-in-out;
    }

    .robot-entity-btn[data-state="ACTIVE"] .robot-eye {
      fill:
        var(--accent-lime);

      transform:
        scaleY(1);

      filter:
        drop-shadow(
          0 0 8px
          var(--accent-lime)
        );
    }

    @keyframes robotActivePulse {
      0%,
      100% {
        transform: scale(1);
      }

      
      50% {
        transform: scale(1.03);
      }
    }

    /* CONFUSED */

    .robot-entity-btn[data-state="CONFUSED"] .robot-chassis {
      border-color:
        var(--accent-amber);

      box-shadow:
        0 0 25px
        rgba(255, 183, 3, 0.25);
    }

    .robot-entity-btn[data-state="CONFUSED"] .robot-svg {
      animation:
        robotConfusedHead 0.6s var(--ease-expo);
    }

    .robot-entity-btn[data-state="CONFUSED"] .robot-eye {
      fill:
        var(--accent-amber);

      transform:
        scaleY(0.6)
        rotate(-10deg);

      filter:
        drop-shadow(
          0 0 8px
          var(--accent-amber)
        );
    }

    @keyframes robotConfusedHead {
      0%,
      100% {
        transform: rotate(0deg);
      }

      30% {
        transform:
          rotate(-10deg)
          translateY(-2px);
      }

      70% {
        transform:
          rotate(10deg)
          translateY(-1px);
      }
    }

    /* ANGRY */

    .robot-entity-btn[data-state="ANGRY"] .robot-chassis {
      border-color:
        var(--accent-red);

      box-shadow:
        0 0 30px
        rgba(255, 51, 102, 0.4);

      animation:
        robotShake 0.4s ease-in-out;
    }

    .robot-entity-btn[data-state="ANGRY"] .robot-eye {
      fill:
        var(--accent-red);

      transform:
        scaleY(0.4)
        skewX(-15deg);

      filter:
        drop-shadow(
          0 0 10px
          var(--accent-red)
        );
    }

    @keyframes robotShake {
      0%,
      100% {
        transform: translateX(0);
      }

      20% {
        transform: translateX(-3px);
      }

      40% {
        transform: translateX(3px);
      }

      60% {
        transform: translateX(-2px);
      }

      80% {
        transform: translateX(2px);
      }
    }

    /* ==========================================================================
       ROBOT STATE TAG
       ========================================================================== */

    .robot-state-tag {
      font-family: var(--font-mono);

      font-size: 0.65rem;

      letter-spacing: 0.18em;

      color:
        var(--text-muted);

      text-transform: uppercase;

      background:
        rgba(8, 14, 10, 0.8);

      padding:
        4px 10px;

      border-radius: 100px;

      border:
        1px solid
        var(--border-subtle);

      backdrop-filter: blur(8px);

      opacity: 0;

      transform:
        translateX(8px);

      transition:
        all 0.3s var(--ease-expo);

      pointer-events: none;
    }

    .robot-entity-btn:hover .robot-state-tag {
      opacity: 1;

      transform:
        translateX(0);
    }

    /* ==========================================================================
       AI GUIDE CARD
       ========================================================================== */

    .ai-guide-card {
      position: absolute;

      bottom: 68px;
      right: 0;

      width:
        min(340px, 88vw);

      background:
        rgba(8, 14, 10, 0.92);

      border:
        1px solid
        var(--border-subtle);

      border-radius: 20px;

      backdrop-filter: blur(24px);

      box-shadow:
        0 20px 50px
        rgba(0, 0, 0, 0.85);

      padding: 1.25rem;

      display: flex;
      flex-direction: column;

      gap: 1rem;

      opacity: 0;
      visibility: hidden;

      transform:
        translateY(12px)
        scale(0.96);

      transition:
        all 0.4s var(--ease-expo);

    .ai-card-header {

    .ai-response-box {
      font-size: 0.85rem;

      line-height: 1.5;

      color:

      min-height: 48px;

      display: flex;

      align-items: center;

    .ai-options-stack {
      display: flex;

      gap: 0.6rem;
    }

    .ai-option-btn {
      width: 100%;

      background:
        rgba(255, 255, 255, 0.025);

      border:
        1px solid
        var(--border-subtle);

      border-radius: 10px;

      padding:
        0.65rem 0.85rem;

      font-family:
        var(--font-mono);

      font-size: 0.725rem;

      letter-spacing: 0.08em;

        var(--text-muted);

      transition:

      align-items: center;

      justify-content: space-between;

    .ai-option-btn:hover {
      background:
        rgba(163, 255, 18, 0.08);

      border-color:
        var(--accent-lime);

      color:
        var(--text-main);

      transform:

    }

    .ai-option-btn svg {
      width: 12px;
      height: 12px;

      stroke:
        var(--accent-lime);
    }

    .ai-option-btn.out-of-scope-btn {
      border-color:
        rgba(255, 183, 3, 0.2);
    }

    .ai-option-btn.out-of-scope-btn:hover {
      background:
        rgba(255, 183, 3, 0.1);

      border-color:
        var(--accent-amber);

      color:
        var(--accent-amber);
    }

    /* ==========================================================================
       RESPONSIVE
       ========================================================================== */

    @media (max-width: 768px) {

      .spatial-actions {
        flex-direction: column;
        gap: 1rem;
      }

      .action-node {
        width: 100%;
      }

      .wordmark {
        letter-spacing: 0.15em;
      }

      .philosophy-tag {
        letter-spacing: 0.2em;
        margin-bottom: 2.5rem;
      }

      .ai-guide-card {
        right: -10px;

        width:
          calc(100vw - 2.5rem);
      }
    }

    /* ==========================================================================
       REDUCED MOTION
       ========================================================================== */

    @media (prefers-reduced-motion: reduce) {

      *,
      *::before,
      *::after {
        animation: none !important;

        transition:
          opacity 0.1s ease !important;
      }

      #network-canvas {
        display: none;
      }
    }
  </style>
</head>

<body>

  <canvas id="network-canvas"></canvas>

  <div class="vignette-overlay"></div>
  <div class="grid-overlay"></div>

  <div class="app-viewport">

    <!-- =========================================================
         HEADER
    ========================================================== -->

    <header class="system-header">

      <!-- RANDOM LOGO -->

      <a

      >

        <div class="brand">

          <div class="brand-symbol">

            <div class="loop one"></div>

            <div class="loop two"></div>

            <!-- BLACK HOLE -->

          </div>

      </a>

      <!-- EARLY ACCESS -->

        <span class="badge-red-dot"></span>

      </div>

    </header>

    <!-- =========================================================
         HERO
    ========================================================== -->

    <main class="hero-spatial">

      <div class="wordmark-container">

        <h1 class="wordmark">

        </h1>

      </div>

      <p class="philosophy-tag">
        Everything is RANDOM.
      </p>

      <!-- ACTIONS -->

      <div class="spatial-actions">

        <!-- EXPLORE -->

        <div

        >

          <div class="node-title">

            <svg

              <path
                d="M3.33 8h9.34M8 3.33L12.67 8 8 12.67"

          </div>

          <span class="node-caption">

          </span>

        </div>

        <!-- CREATE RID -->

        <div
          class="action-node action-node-create"
          id="btnCreateRID"
          tabindex="0"
          role="button"
          aria-label="Create a RID requirement"
        >

          <div class="node-title">

            <span>

            </span>

            <svg
              viewBox="0 0 16 16"

            >
              <path
                d="M8 3.33v9.34M3.33 8h9.34"

                stroke-linecap="round"
                stroke-linejoin="round"

            </svg>

          </div>

          <span class="node-caption">

          </span>

        </div>

      </div>

    </main>

    <!-- =========================================================
         FOOTER
    ========================================================== -->

    <footer class="system-footer">

      <span>
        RANDOM DISCOVERY NETWORK // CONCEPT LANDING
      </span>

    </footer>

    <!-- =========================================================
         AI ROBOT
    ========================================================== -->

    <div class="robot-anchor">

      <div
        class="ai-guide-card"
        id="aiGuideCard"
        role="dialog"
        aria-label="RANDOM Guide Options"
      >

        <div class="ai-card-header">

          <span class="ai-identity-label">
            RANDOM // GUIDE
          </span>

          <span
            style="
              font-family: var(--font-mono);
              font-size: 0.6rem;
              color: var(--text-dim);
            "
          >
            SELECT SIGNAL
          </span>

        </div>

        <div
          class="ai-response-box"
          id="aiResponseText"
        >
          Choose a signal option below to query the guide:
        </div>

        <div
          class="ai-options-stack"
          id="aiOptionsStack"
        ></div>

      </div>

      <!-- ROBOT BUTTON -->

      <button
        class="robot-entity-btn"
        id="robotEntity"
        data-state="SLEEPING"
        aria-expanded="false"
        aria-label="Wake RANDOM AI Guide"
      >

        <span
          class="robot-state-tag"
          id="robotStateLabel"
        >
          SLEEPING
        </span>

        <div class="robot-chassis">

          <svg
            class="robot-svg"
            viewBox="0 0 32 32"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
          >

            <rect
              x="6"
              y="9"
              width="20"
              height="14"
              rx="5"
              fill="rgba(8, 14, 10, 0.9)"
              stroke="rgba(163, 255, 18, 0.3)"
              stroke-width="1.2"
            />

            <ellipse
              class="robot-eye"
              cx="12"
              cy="16"
              rx="2.2"
              ry="2.2"
            />

            <ellipse
              class="robot-eye"
              cx="20"
              cy="16"
              rx="2.2"
              ry="2.2"
            />

            <line
              x1="16"
              y1="9"
              x2="16"
              y2="4"
              stroke="rgba(163, 255, 18, 0.4)"
              stroke-width="1.2"
            />

            <circle
              cx="16"
              cy="3"
              r="1.5"
              fill="var(--accent-lime)"
            />

          </svg>

        </div>

      </button>

    </div>

  </div>

  <!-- TOAST -->

  <div
    class="toast-overlay"
    id="toastOverlay"
  >
    EXPLORE — COMING NEXT
  </div>

  <script>

    /* ==========================================================================
       ATMOSPHERIC NETWORK CANVAS
       ========================================================================== */

    (function initNetworkBackground() {

      const canvas =
        document.getElementById('network-canvas');

      const ctx =
        canvas.getContext('2d');

      let width;
      let height;

      let nodes = [];

      function resize() {

        width =
          canvas.width =
          window.innerWidth;

        height =
          canvas.height =
          window.innerHeight;

      }

      window.addEventListener(
        'resize',
        resize
      );

      resize();

      const nodeCount =
        Math.floor(
          Math.min(width, height) / 25
        );

      for (
        let i = 0;
        i < nodeCount;
        i++
      ) {

        nodes.push({

          x:
            Math.random() * width,

          y:
            Math.random() * height,

          vx:
            (Math.random() - 0.5) * 0.15,

          vy:
            (Math.random() - 0.5) * 0.15,

          radius:
            Math.random() * 1.5 + 0.8

        });

      }

      function render() {

        ctx.clearRect(
          0,
          0,
          width,
          height
        );

        for (
          let i = 0;
          i < nodes.length;
          i++
        ) {

          const n1 =
            nodes[i];

          n1.x += n1.vx;
          n1.y += n1.vy;

          if (
            n1.x < 0 ||
            n1.x > width
          ) {
            n1.vx *= -1;
          }

          if (
            n1.y < 0 ||
            n1.y > height
          ) {
            n1.vy *= -1;
          }

          ctx.fillStyle =
            'rgba(163, 255, 18, 0.45)';

          ctx.beginPath();

          ctx.arc(
            n1.x,
            n1.y,
            n1.radius,
            0,
            Math.PI * 2
          );

          ctx.fill();

          for (
            let j = i + 1;
            j < nodes.length;
            j++
          ) {

            const n2 =
              nodes[j];

            const dx =
              n1.x - n2.x;

            const dy =
              n1.y - n2.y;

            const dist =
              Math.sqrt(
                dx * dx +
                dy * dy
              );

            if (dist < 140) {

              const alpha =
                (1 - dist / 140) *
                0.04;

              ctx.strokeStyle =
                `rgba(163, 255, 18, ${alpha})`;

              ctx.lineWidth = 1;

              ctx.beginPath();

              ctx.moveTo(
                n1.x,
                n1.y
              );

              ctx.lineTo(
                n2.x,
                n2.y
              );

              ctx.stroke();

            }

          }

        }

        requestAnimationFrame(
          render
        );

      }

      if (
        !window.matchMedia(
          '(prefers-reduced-motion: reduce)'
        ).matches
      ) {

        render();

      }

    })();

      /* ==========================================================================
       PRIMARY ACTION BUTTONS
       ========================================================================== */

    (function initActionButtons() {

      const btnExplore =
        document.getElementById(
          'btnExplore'
        );

      const btnCreateRID =
        document.getElementById(
          'btnCreateRID'
        );

      const toast =
        document.getElementById(
          'toastOverlay'
        );

      let timeoutId;

      function showToast(
        text,
        isCyan = false
      ) {

        clearTimeout(timeoutId);

        toast.innerText =
          text;

        if (isCyan) {

          toast.classList.add(
            'cyan-theme'
          );

        } else {

          toast.classList.remove(
            'cyan-theme'
          );

        }

        toast.classList.add(
          'active'
        );

        timeoutId =
          setTimeout(() => {

            toast.classList.remove(
              'active'
            );

          }, 1800);

      }

      btnExplore.addEventListener(
        'click',
        () =>
          showToast(
            'EXPLORE — COMING NEXT',
            false
          )
      );

      btnCreateRID.addEventListener(
        'click',
        () =>
          showToast(
            'CREATE RID — COMING NEXT',
            true
          )
      );

      btnExplore.addEventListener(
        'keydown',
        (e) => {

          if (
            e.key === 'Enter'
          ) {

            showToast(
              'EXPLORE — COMING NEXT',
              false
            );

          }

        }
      );

      btnCreateRID.addEventListener(
        'keydown',
        (e) => {

          if (
            e.key === 'Enter'
          ) {

            showToast(
              'CREATE RID — COMING NEXT',
              true
            );

          }

        }
      );

      /* Mouse tracking */

      document
        .querySelectorAll(
          '.action-node'
        )
        .forEach(node => {

          node.addEventListener(
            'mousemove',
            (e) => {

              const rect =
                node.getBoundingClientRect();

              const x =
                ((e.clientX - rect.left) /
                  rect.width) *
                100;

              const y =
                ((e.clientY - rect.top) /
                  rect.height) *
                100;

              node.style.setProperty(
                '--mouse-x',
                `${x}%`
              );

              node.style.setProperty(
                '--mouse-y',
                `${y}%`
              );

            }
          );

        });

    })();


    /* ==========================================================================
       RANDOM AI GUIDE
       ========================================================================== */

    const RobotGuideSystem =
      (function () {

        const robotEntity =
          document.getElementById(
            'robotEntity'
          );

        const robotStateLabel =
          document.getElementById(
            'robotStateLabel'
          );

        const aiGuideCard =
          document.getElementById(
            'aiGuideCard'
          );

        const aiResponseText =
          document.getElementById(
            'aiResponseText'
          );

        const aiOptionsStack =
          document.getElementById(
            'aiOptionsStack'
          );

        let currentState =
          'SLEEPING';

        let inactivityTimer;

        let abuseCount = 0;


        /* =====================================================
           KNOWLEDGE BASE
        ===================================================== */

        const QUESTION_SETS = [

          {
            pairId:
              'SET_PRIMARY',

            options: [

              {
                label:
                  "WHAT IS RANDOM?",

                response:
                  "RANDOM is an intelligent discovery and requirement network designed to match needs dynamically without noisy dashboards.",

                nextSet:
                  1
              },

              {
                label:
                  "WHAT IS A RID?",

                response:
                  "A RID is a created Requirement ID—a structured signal representing what you need or offer in the RANDOM network.",

                nextSet:
                  2
              }

            ]
          },

          {
            pairId:
              'SET_CONCEPT_DEEP',

            options: [

              {
                label:
                  "WHY DOES RANDOM EXIST?",

                response:
                  "RANDOM exists to replace rigid search bars and noisy feeds with direct, intelligent signal alignment.",

                nextSet:
                  3
              },

              {
                label:
                  "HOW DOES MATCHING WORK?",

                response:
                  "The network aligns complementary RIDs through context-aware signal matching without middleman clutter.",

                nextSet:
                  4
              }

            ]
          },

          {
            pairId:
              'SET_RID_DEEP',

            options: [

              {
                label:
                  "WHAT CAN A RID REPRESENT?",

                response:
                  "A RID can signal any human or technical requirement—from talent and services to physical resources or dynamic requests.",

                nextSet:
                  4
              },

              {
                label:
                  "HOW ARE RIDs CREATED?",

                response:
                  "By selecting 'CREATE RID', you broadcast a clean, structured requirement signal directly into the living network.",

                nextSet:
                  3
              }

            ]
          },

          {
            pairId:
              'SET_EXPLORE_DEEP',

            options: [

              {
                label:
                  "WHAT DOES EXPLORE DO?",

                response:
                  "EXPLORE connects you to the live network matrix, letting you discover open requirements matched to your scope.",

                nextSet:
                  5
              },

              {
                label:
                  "IS RANDOM A DASHBOARD?",

                response:
                  "No. RANDOM strips away static dashboards in favor of direct, dynamic signal discovery.",

                nextSet:
                  0
              }

            ]
          },

          {
            pairId:
              'SET_SIGNAL_INTELLIGENCE',

            options: [

              {
                label:
                  "HOW DO SIGNALS WORK?",

                response:
                  "Signals are concise intent vectors. Instead of searching keywords, signals continuously align complementary needs.",

                nextSet:
                  5
              },

              {
                label:
                  "IS RANDOM FREE TO USE?",

                response:
                  "During Early Access, core signal broadcasting and discovery are completely open for network participants.",

                nextSet:
                  0
              }

            ]
          },

          {
            pairId:
              'SET_OUT_OF_SCOPE_TEST',

            options: [

              {
                label:
                  "WHAT IS THE ULTIMATE GOAL?",

                response:
                  "To build a seamless global discovery layer where requirements find solutions instantly.",

                nextSet:
                  0
              },

              {
                label:
                  "[ SIMULATE UNRELATED SIGNAL ]",

                isOutOfScopeTrigger:
                  true,

                response:
                  "That is outside the RANDOM network scope.",

                nextSet:
                  0
              }

            ]
          }

        ];


        /* =====================================================
           STATE
        ===================================================== */

        function setState(
          newState
        ) {

          currentState =
            newState;

          robotEntity.setAttribute(
            'data-state',
            newState
          );

          robotStateLabel.innerText =
            newState;

          if (
            newState === 'SLEEPING'
          ) {

            aiGuideCard.classList.remove(
              'open'
            );

            robotEntity.setAttribute(
              'aria-expanded',
              'false'
            );

            clearTimeout(
              inactivityTimer
            );

          } else {

            aiGuideCard.classList.add(
              'open'
            );

            robotEntity.setAttribute(
              'aria-expanded',
              'true'
            );

            resetInactivityTimer();

          }

        }


        /* =====================================================
           INACTIVITY
        ===================================================== */

        function resetInactivityTimer() {

          clearTimeout(
            inactivityTimer
          );

          inactivityTimer =
            setTimeout(() => {

              setState(
                'SLEEPING'
              );

            }, 14000);

        }


        /* =====================================================
           RENDER OPTIONS
        ===================================================== */

        function renderOptions(
          setIndex
        ) {

          const currentSet =
            QUESTION_SETS[setIndex] ||
            QUESTION_SETS[0];

          aiOptionsStack.innerHTML =
            '';

          currentSet.options
            .slice(0, 2)
            .forEach(opt => {

              const btn =
                document.createElement(
                  'button'
                );

              btn.className =
                `ai-option-btn ${
                  opt.isOutOfScopeTrigger
                    ? 'out-of-scope-btn'
                    : ''
                }`;

              btn.innerHTML = `
                <span>
                  ${opt.label}
                </span>

                <svg
                  viewBox="0 0 16 16"
                  fill="none"
                  stroke="currentColor"
                >
                  <path
                    d="M3.33 8h9.34M8 3.33L12.67 8 8 12.67"
                    stroke-width="1.5"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  />
                </svg>
              `;

              btn.addEventListener(
                'click',
                () => {

                  handleOptionSelect(
                    opt
                  );

                }
              );

              aiOptionsStack.appendChild(
                btn
              );

            });

        }


        /* =====================================================
           OPTION SELECTION
        ===================================================== */

        function handleOptionSelect(
          option
        ) {

          resetInactivityTimer();

          if (
            option.isOutOfScopeTrigger
          ) {

            abuseCount++;

            if (
              abuseCount >= 2
            ) {

              setState(
                'ANGRY'
              );

              aiResponseText.innerText =
                "Signal error. Focus strictly on RANDOM concepts.";

              setTimeout(() => {

                setState(
                  'ACTIVE'
                );

                renderOptions(
                  0
                );

              }, 1800);

            } else {

              setState(
                'CONFUSED'
              );

              aiResponseText.innerText =
                option.response;

              setTimeout(() => {

                setState(
                  'ACTIVE'
                );

                renderOptions(
                  option.nextSet
                );

              }, 1600);

            }

            return;
          }

          aiResponseText.innerText =
            option.response;

          renderOptions(
            option.nextSet
          );

        }


        /* =====================================================
           LISTENERS
        ===================================================== */

        function initListeners() {

          robotEntity.addEventListener(
            'click',
            (e) => {

              e.stopPropagation();

              if (
                currentState ===
                'SLEEPING'
              ) {

                setState(
                  'ACTIVE'
                );

                aiResponseText.innerText =
                  "Select a signal option below to query the guide:";

                renderOptions(
                  0
                );

              } else {

                setState(
                  'SLEEPING'
                );

              }

            }
          );


          document.addEventListener(
            'keydown',
            (e) => {

              if (
                e.key === 'Escape' &&
                currentState !==
                'SLEEPING'
              ) {

                setState(
                  'SLEEPING'
                );

              }

            }
          );


          document.addEventListener(
            'click',
            (e) => {

              if (
                !robotEntity.contains(
                  e.target
                ) &&
                !aiGuideCard.contains(
                  e.target
                ) &&
                currentState !==
                'SLEEPING'
              ) {

                setState(
                  'SLEEPING'
                );

              }

            }
          );

        }


        initListeners();


        return {
          setState
        };

      })();

  </script>
