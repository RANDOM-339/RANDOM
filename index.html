<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RANDOM — Beyond the Expected</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

:root{
    --red:#ff284d;
    --blue:#287cff;
    --white:#f4f6ff;
    --dim:rgba(235,240,255,.48);
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
}

body{
    background:#020307;
    color:var(--white);
    font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;
}


/* =====================================================
   UNIVERSE
===================================================== */

.universe{
    position:fixed;
    inset:0;
    overflow:hidden;
    background:#020307;
}


/* central darkness */

.universe::after{
    content:"";
    position:absolute;
    inset:0;

    background:
        radial-gradient(
            ellipse at center,
            transparent 0%,
            rgba(0,0,0,.18) 45%,
            rgba(0,0,0,.75) 100%
        );

    pointer-events:none;
}


/* =====================================================
   RED UNIVERSE
===================================================== */

.red-field{
    position:absolute;

    width:75vw;
    height:75vw;

    min-width:500px;
    min-height:500px;

    left:-27vw;
    top:50%;

    transform:
        translateY(-50%)
        rotate(-14deg);

    border-radius:50%;

    background:
        radial-gradient(
            circle at 65% 50%,
            rgba(255,25,65,.75),
            rgba(170,8,38,.35) 30%,
            rgba(90,3,20,.15) 52%,
            transparent 72%
        );

    filter:blur(35px);

    animation:
        redFloat 18s ease-in-out infinite alternate;
}


@keyframes redFloat{

    0%{
        transform:
            translateY(-50%)
            rotate(-14deg)
            scale(.95);
    }

    100%{
        transform:
            translateY(-48%)
            rotate(-4deg)
            scale(1.08);
    }
}


/* =====================================================
   BLUE UNIVERSE
===================================================== */

.blue-field{
    position:absolute;

    width:75vw;
    height:75vw;

    min-width:500px;
    min-height:500px;

    right:-27vw;
    top:50%;

    transform:
        translateY(-50%)
        rotate(14deg);

    border-radius:50%;

    background:
        radial-gradient(
            circle at 35% 50%,
            rgba(35,110,255,.75),
            rgba(12,62,190,.35) 30%,
            rgba(5,30,100,.15) 52%,
            transparent 72%
        );

    filter:blur(35px);

    animation:
        blueFloat 20s ease-in-out infinite alternate;
}


@keyframes blueFloat{

    0%{
        transform:
            translateY(-50%)
            rotate(14deg)
            scale(.95);
    }

    100%{
        transform:
            translateY(-52%)
            rotate(4deg)
            scale(1.08);
    }
}


/* =====================================================
   PARTICLE STREAMS
===================================================== */

.streams{
    position:absolute;
    inset:0;
    opacity:.4;
}

.stream{
    position:absolute;

    height:1px;

    transform-origin:left center;

    animation:
        streamMove 9s linear infinite;
}

.stream.red{
    width:32vw;
    left:0;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(255,40,70,.65),
            transparent
        );
}

.stream.blue{
    width:32vw;
    right:0;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(45,120,255,.65),
            transparent
        );

    transform-origin:right center;
}


.stream:nth-child(1){
    top:31%;
    transform:rotate(7deg);
    animation-delay:-2s;
}

.stream:nth-child(2){
    top:43%;
    transform:rotate(-4deg);
    animation-delay:-5s;
}

.stream:nth-child(3){
    top:62%;
    transform:rotate(5deg);
    animation-delay:-1s;
}

.stream:nth-child(4){
    top:72%;
    transform:rotate(-7deg);
    animation-delay:-7s;
}


@keyframes streamMove{

    0%{
        opacity:0;
        transform:translateX(-30%) scaleX(.5);
    }

    20%{
        opacity:.7;
    }

    80%{
        opacity:.5;
    }

    100%{
        opacity:0;
        transform:translateX(30%) scaleX(1.1);
    }
}


/* =====================================================
   STARS
===================================================== */

.stars{
    position:absolute;
    inset:0;
}

.star{
    position:absolute;

    width:2px;
    height:2px;

    border-radius:50%;

    background:white;

    opacity:.35;

    animation:
        starPulse 5s ease-in-out infinite;
}

.star:nth-child(1){left:7%;top:14%;animation-delay:-1s}
.star:nth-child(2){left:15%;top:78%;animation-delay:-3s}
.star:nth-child(3){left:25%;top:26%;animation-delay:-2s}
.star:nth-child(4){left:34%;top:86%;animation-delay:-4s}
.star:nth-child(5){left:46%;top:12%;animation-delay:-1.5s}
.star:nth-child(6){left:54%;top:89%;animation-delay:-3.5s}
.star:nth-child(7){left:64%;top:21%;animation-delay:-2.5s}
.star:nth-child(8){left:74%;top:76%;animation-delay:-4.5s}
.star:nth-child(9){left:83%;top:17%;animation-delay:-1.2s}
.star:nth-child(10){left:92%;top:58%;animation-delay:-3.2s}
.star:nth-child(11){left:12%;top:45%;animation-delay:-2.2s}
.star:nth-child(12){left:88%;top:84%;animation-delay:-4.2s}
.star:nth-child(13){left:42%;top:70%;animation-delay:-1.7s}
.star:nth-child(14){left:59%;top:38%;animation-delay:-3.7s}


@keyframes starPulse{

    0%,100%{
        opacity:.15;
        transform:scale(.7);
    }

    50%{
        opacity:.75;
        transform:scale(1.7);
    }
}


/* =====================================================
   CENTER PORTAL
===================================================== */

.center{
    position:absolute;

    left:50%;
    top:50%;

    width:440px;
    height:440px;

    transform:translate(-50%,-50%);

    display:flex;
    align-items:center;
    justify-content:center;

    z-index:5;
}


/* energy halo */

.halo{
    position:absolute;

    width:100%;
    height:100%;

    border-radius:50%;

    background:
        conic-gradient(
            from 0deg,
            transparent,
            rgba(255,35,65,.20),
            transparent 25%,
            rgba(50,120,255,.22),
            transparent 50%,
            rgba(255,35,65,.16),
            transparent 75%
        );

    filter:blur(25px);

    animation:
        haloSpin 24s linear infinite;
}


@keyframes haloSpin{
    to{
        transform:rotate(360deg);
    }
}


/* orbit */

.orbit{
    position:absolute;

    width:330px;
    height:125px;

    border-radius:50%;

    border:1px solid rgba(255,255,255,.28);

    transform:rotate(-25deg);

    animation:
        orbitSpin 16s linear infinite;
}


.orbit::before{
    content:"";

    position:absolute;

    width:7px;
    height:7px;

    border-radius:50%;

    background:white;

    box-shadow:
        0 0 15px white;

    left:20%;
    top:0;
}


.orbit::after{
    content:"";

    position:absolute;

    width:5px;
    height:5px;

    border-radius:50%;

    background:white;

    box-shadow:
        0 0 13px white;

    right:18%;
    bottom:0;
}


@keyframes orbitSpin{

    0%{
        transform:rotate(-25deg);
    }

    100%{
        transform:rotate(335deg);
    }
}


/* =====================================================
   RANDOM CORE
===================================================== */

.core{
    position:relative;

    width:215px;
    height:215px;

    border-radius:50%;

    display:flex;
    align-items:center;
    justify-content:center;

    background:
        radial-gradient(
            circle at 35% 30%,
            rgba(255,255,255,.15),
            rgba(8,10,18,.95) 48%,
            #010207 72%
        );

    border:1px solid rgba(255,255,255,.20);

    box-shadow:
        0 0 50px rgba(255,255,255,.08),
        0 0 100px rgba(80,90,255,.08),
        inset 0 0 40px rgba(255,255,255,.035);
}


/* =====================================================
   RANDOM SYMBOL
===================================================== */

.symbol{
    position:relative;

    width:85px;
    height:85px;
}


.symbol::before{
    content:"";

    position:absolute;

    inset:8px;

    border-radius:50%;

    border:3px solid white;

    box-shadow:
        0 0 15px rgba(255,255,255,.35);
}


/* crossing cosmic paths */

.symbol span{
    position:absolute;

    left:50%;
    top:50%;

    width:105px;
    height:34px;

    border:2px solid rgba(255,255,255,.85);

    border-radius:50%;

    transform:
        translate(-50%,-50%)
        rotate(32deg);
}


.symbol span:nth-child(2){
    transform:
        translate(-50%,-50%)
        rotate(-32deg);
}


/* central point */

.symbol i{
    position:absolute;

    width:13px;
    height:13px;

    border-radius:50%;

    left:50%;
    top:50%;

    transform:translate(-50%,-50%);

    background:white;

    box-shadow:
        0 0 15px white,
        0 0 30px rgba(90,120,255,.8);
}


/* =====================================================
   BRAND
===================================================== */

.brand{
    position:absolute;

    left:50%;
    top:50%;

    transform:
        translate(-50%,98px);

    white-space:nowrap;

    font-size:14px;

    font-weight:700;

    letter-spacing:.52em;

    margin-left:.52em;

    color:rgba(255,255,255,.75);
}


/* =====================================================
   MAIN CONTENT
===================================================== */

.interface{
    position:absolute;

    left:50%;
    top:50%;

    transform:translate(-50%,265px);

    z-index:10;

    width:min(520px,calc(100vw - 36px));

    text-align:center;
}


.motto{
    font-size:10px;

    text-transform:uppercase;

    letter-spacing:.30em;

    color:rgba(255,255,255,.42);

    margin-bottom:20px;
}


/* =====================================================
   ENTRY OPTIONS
===================================================== */

.entries{
    display:flex;

    gap:10px;

    justify-content:center;
}


.entry{
    position:relative;

    min-width:190px;

    height:58px;

    border-radius:15px;

    border:1px solid rgba(255,255,255,.14);

    background:rgba(3,5,11,.55);

    color:white;

    cursor:pointer;

    overflow:hidden;

    backdrop-filter:blur(12px);

    transition:
        transform .3s ease,
        border-color .3s ease,
        background .3s ease;
}


.entry:hover{
    transform:translateY(-4px);
}


.entry::before{
    content:"";

    position:absolute;

    width:100px;
    height:100px;

    border-radius:50%;

    filter:blur(25px);

    opacity:0;

    transition:.35s ease;
}


.entry:hover::before{
    opacity:.7;
}


.entry.visitor::before{
    background:var(--blue);

    left:-45px;
    top:-55px;
}


.entry.rid::before{
    background:var(--red);

    right:-45px;
    top:-55px;
}


.entry:hover{
    border-color:rgba(255,255,255,.30);
}


.entry-content{
    position:relative;

    z-index:2;

    height:100%;

    display:flex;

    align-items:center;

    justify-content:center;

    gap:11px;
}


.entry-icon{
    font-size:17px;

    opacity:.8;
}


.entry-name{
    font-size:12px;

    font-weight:700;

    letter-spacing:.20em;
}


.entry-desc{
    display:block;

    margin-top:3px;

    color:rgba(255,255,255,.36);

    font-size:8px;

    letter-spacing:.05em;
}


/* =====================================================
   TOP BRAND
===================================================== */

.top{
    position:absolute;

    left:28px;
    right:28px;
    top:24px;

    z-index:20;

    display:flex;

    justify-content:space-between;

    align-items:center;
}


.mini-brand{
    display:flex;

    align-items:center;

    gap:9px;

    color:rgba(255,255,255,.60);

    font-size:10px;

    font-weight:700;

    letter-spacing:.28em;
}


.mini-dot{
    width:8px;
    height:8px;

    border-radius:50%;

    background:white;

    box-shadow:
        0 0 12px rgba(255,255,255,.8);
}


.status{
    color:rgba(255,255,255,.28);

    font-size:8px;

    letter-spacing:.18em;

    text-transform:uppercase;
}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:650px){

    .center{
        width:330px;
        height:330px;
    }

    .orbit{
        width:255px;
        height:95px;
    }

    .core{
        width:165px;
        height:165px;
    }

    .symbol{
        transform:scale(.75);
    }

    .brand{
        transform:
            translate(-50%,77px);

        font-size:10px;
    }

    .interface{
        transform:
            translate(-50%,210px);
    }

    .motto{
        font-size:8px;

        letter-spacing:.22em;

        margin-bottom:14px;
    }

    .entries{
        flex-direction:column;

        gap:8px;
    }

    .entry{
        width:100%;
        min-width:0;

        height:54px;
    }

    .entry-content{
        justify-content:flex-start;

        padding-left:22px;
    }

    .status{
        display:none;
    }

    .top{
        left:18px;
        right:18px;
        top:19px;
    }

    .mini-brand{
        font-size:9px;
    }
}


@media(max-height:700px) and (min-width:651px){

    .center{
        transform:
            translate(-50%,-56%);
    }

    .interface{
        transform:
            translate(-50%,235px);
    }
}

</style>
</head>


<body>


<!-- ==========================================
     COSMIC ENVIRONMENT
========================================== -->

<div class="universe">

    <div class="red-field"></div>

    <div class="blue-field"></div>


    <div class="streams">

        <div class="stream red"></div>
        <div class="stream blue"></div>

        <div class="stream red"></div>
        <div class="stream blue"></div>

    </div>


    <div class="stars">

        <span class="star"></span>
        <span class="star"></span>
        <span class="star"></span>
        <span class="star"></span>
        <span class="star"></span>
        <span class="star"></span>
        <span class="star"></span>
        <span class="star"></span>
        <span class="star"></span>
        <span class="star"></span>
        <span class="star"></span>
        <span class="star"></span>
        <span class="star"></span>
        <span class="star"></span>

    </div>

</div>


<!-- ==========================================
     TOP IDENTITY
========================================== -->

<header class="top">

    <div class="mini-brand">

        <span class="mini-dot"></span>

        RANDOM

    </div>


    <div class="status">

        SYSTEM // UNDEFINED

    </div>

</header>


<!-- ==========================================
     CENTER
========================================== -->

<section class="center">

    <div class="halo"></div>

    <div class="orbit"></div>


    <div class="core">

        <div class="symbol">

            <span></span>
            <span></span>

            <i></i>

        </div>

    </div>


    <div class="brand">

        RANDOM

    </div>

</section>


<!-- ==========================================
     ENTRY INTERFACE
========================================== -->

<section class="interface">

    <div class="motto">

        Choose how you enter

    </div>


    <div class="entries">


        <!-- VISITOR -->

        <button
            class="entry visitor"
            onclick="visitor()"
        >

            <div class="entry-content">

                <span class="entry-icon">
                    ◉
                </span>

                <span>

                    <span class="entry-name">
                        VISITOR
                    </span>

                    <span class="entry-desc">
                        Explore the universe
                    </span>

                </span>

            </div>

        </button>


        <!-- CREATE RID -->

        <button
            class="entry rid"
            onclick="createRID()"
        >

            <div class="entry-content">

                <span class="entry-icon">
                    ✦
                </span>

                <span>

                    <span class="entry-name">
                        CREATE RID
                    </span>

                    <span class="entry-desc">
                        Create your identity
                    </span>

                </span>

            </div>

        </button>


    </div>

</section>


<script>

/*
=================================================
RANDOM MICRO-INTERACTION
=================================================
*/

const center = document.querySelector(".center");

window.addEventListener("mousemove", (event)=>{

    const x =
        (event.clientX / window.innerWidth - .5);

    const y =
        (event.clientY / window.innerHeight - .5);

    center.style.transform =
        `
        translate(-50%,-50%)
        rotateX(${y * -3}deg)
        rotateY(${x * 3}deg)
        `;
});


/*
=================================================
TEMPORARY ENTRY ACTIONS
=================================================
*/

function visitor(){

    alert(
        "VISITOR\n\n" +
        "Your journey into RANDOM begins here."
    );

}


function createRID(){

    alert(
        "CREATE RID\n\n" +
        "Your RANDOM identity will be created here."
    );

}

</script>

</body>
    </html>
