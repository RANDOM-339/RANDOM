<title>RANDOM - site viewer</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f4f5f8;--card:#fff;--ink:#12141c;--mut:#5d6478;--line:#dfe2ea;--acc:#0a84a5;--code:#f0f2f7}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#08090d;--card:#11131a;--ink:#eceff6;--mut:#8b91a3;--line:#252938;--acc:#2ee6ff;--code:#0c0e14}}
:root[data-theme="dark"]{--bg:#08090d;--card:#11131a;--ink:#eceff6;--mut:#8b91a3;--line:#252938;--acc:#2ee6ff;--code:#0c0e14}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--card);flex:none}
h1{font-size:15px;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tabs{display:flex;gap:4px;padding:3px;border-radius:99px;background:var(--code);flex:none}
.tabs button{border:0;border-radius:99px;padding:7px 16px;font:600 13px system-ui,sans-serif;background:none;color:var(--mut);cursor:pointer}
.tabs button.on{background:var(--acc);color:#04121a}
main{flex:1;min-height:0;display:flex;flex-direction:column}
#pv{flex:1;min-height:0;display:flex;flex-direction:column}
#fr{flex:1;width:100%;border:0;background:#08090d}
.note{padding:8px 14px;font-size:12.5px;color:var(--mut);border-bottom:1px solid var(--line);flex:none}
#cd{flex:1;min-height:0;display:none;flex-direction:column}
.bar{display:flex;flex-wrap:wrap;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line);flex:none;max-height:38%;overflow:auto}
.bar button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:8px 14px;font:600 13px system-ui,sans-serif;cursor:pointer}
.bar button:active{transform:scale(.97)}
#st{padding:6px 14px;font-size:12.5px;color:var(--acc);min-height:28px;flex:none}
#ta{flex:1;min-height:0;width:100%;border:0;resize:none;padding:12px 14px;background:var(--code);color:var(--ink);font:12.5px/1.55 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;white-space:pre;overflow:auto;tab-size:2}
</style></head>
